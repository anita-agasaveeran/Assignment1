<style>
/* ========================================================================== *
 * Identity: instrument-panel neutrals with a cyan-green bias, one teal accent
 * for interactive/structural marks and one rust counter-accent reserved for
 * findings. IBM Plex across three roles - Sans operates, Serif narrates,
 * Mono measures.
 * ========================================================================== */
:root {
  color-scheme: light;
  --bg:        #eef2f3;
  --surface:   #ffffff;
  --surface-2: #f6f9f9;
  --surface-3: #e8eef0;
  --ink:       #10181b;
  --ink-2:     #47585f;
  --ink-3:     #7b8c93;
  --rule:      #d7e0e3;
  --rule-2:    #c2cfd3;
  --accent:    #0d6d78;
  --accent-2:  #0a565f;
  --accent-sf: #dcedee;
  --finding:   #a8431d;
  --finding-sf:#f8e6df;

  --good:      #1d7a4d;
  --warn:      #b07600;
  --serious:   #b4531a;
  --critical:  #b3302f;
  --good-sf:   #dff0e6;
  --warn-sf:   #faeed2;
  --serious-sf:#fae5da;
  --critical-sf:#fadedd;

  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;

  --grid:      #e3eaec;
  --dv-pos:    #2a78d6;
  --dv-neg:    #e34948;
  --dv-mid:    #eef1f0;

  --sans: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif:"IBM Plex Serif", ui-serif, Georgia, "Times New Roman", serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  --rail: 252px;
  --maxw: 1180px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg:        #0b1114;
    --surface:   #121b1f;
    --surface-2: #162126;
    --surface-3: #1d2a30;
    --ink:       #e6eef0;
    --ink-2:     #a3b4bb;
    --ink-3:     #71858d;
    --rule:      #24343a;
    --rule-2:    #32464e;
    --accent:    #47b3bb;
    --accent-2:  #6ecbd2;
    --accent-sf: #10333a;
    --finding:   #e08a63;
    --finding-sf:#37211a;

    --good:      #4bb37a;
    --warn:      #d8a326;
    --serious:   #e08a5a;
    --critical:  #e66767;
    --good-sf:   #14301f;
    --warn-sf:   #322611;
    --serious-sf:#361f14;
    --critical-sf:#3a1c1c;

    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;

    --grid:      #1e2c32;
    --dv-pos:    #3987e5;
    --dv-neg:    #e66767;
    --dv-mid:    #1a2529;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg:#0b1114; --surface:#121b1f; --surface-2:#162126; --surface-3:#1d2a30;
  --ink:#e6eef0; --ink-2:#a3b4bb; --ink-3:#71858d; --rule:#24343a; --rule-2:#32464e;
  --accent:#47b3bb; --accent-2:#6ecbd2; --accent-sf:#10333a;
  --finding:#e08a63; --finding-sf:#37211a;
  --good:#4bb37a; --warn:#d8a326; --serious:#e08a5a; --critical:#e66767;
  --good-sf:#14301f; --warn-sf:#322611; --serious-sf:#361f14; --critical-sf:#3a1c1c;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --grid:#1e2c32; --dv-pos:#3987e5; --dv-neg:#e66767; --dv-mid:#1a2529;
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--sans); font-size: 14px; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
h1,h2,h3,h4 { margin: 0; text-wrap: balance; font-weight: 600; letter-spacing: -0.011em; }
p { margin: 0; }
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ------------------------------------------------------------------ shell - */
.shell { display: grid; grid-template-columns: var(--rail) minmax(0,1fr); min-height: 100vh; }

.rail {
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  background: var(--surface); border-right: 1px solid var(--rule);
  padding: 22px 0 28px; display: flex; flex-direction: column; gap: 20px;
}
.rail-head { padding: 0 20px; }
.mark {
  font-family: var(--mono); font-size: 10px; letter-spacing: .16em; text-transform: uppercase;
  color: var(--accent); font-weight: 600;
}
.rail-title { font-size: 17px; line-height: 1.25; margin-top: 8px; }
.rail-sub { font-family: var(--mono); font-size: 11px; color: var(--ink-3); margin-top: 7px; }

.nav { display: flex; flex-direction: column; }
.nav-group {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: .15em; text-transform: uppercase;
  color: var(--ink-3); padding: 14px 20px 6px;
}
.nav a {
  display: grid; grid-template-columns: 22px 1fr; align-items: baseline; gap: 8px;
  padding: 6px 20px; color: var(--ink-2); text-decoration: none; font-size: 13px;
  border-left: 2px solid transparent;
}
.nav a:hover { color: var(--ink); background: var(--surface-2); }
.nav a.on { color: var(--ink); border-left-color: var(--accent); background: var(--accent-sf); font-weight: 500; }
.nav .ph { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
.nav a.on .ph { color: var(--accent); }

.rail-foot { margin-top: auto; padding: 0 20px; font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); line-height: 1.7; }
.theme-btn {
  font-family: var(--mono); font-size: 11px; color: var(--ink-2); background: var(--surface-2);
  border: 1px solid var(--rule); border-radius: 3px; padding: 5px 9px; cursor: pointer; margin-top: 12px;
}
.theme-btn:hover { border-color: var(--rule-2); color: var(--ink); }

.main { min-width: 0; padding: 0 34px 100px; }
.wrap { max-width: var(--maxw); margin: 0 auto; }

/* ---------------------------------------------------------------- sections - */
section { padding-top: 46px; scroll-margin-top: 12px; }
.sec-head { display: flex; align-items: baseline; gap: 12px; padding-bottom: 6px; border-bottom: 1px solid var(--rule-2); }
.sec-num { font-family: var(--mono); font-size: 12px; color: var(--accent); font-weight: 600; }
.sec-head h2 { font-size: 21px; }
.sec-kicker { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); margin-left: auto; letter-spacing: .04em; }
.lede { font-family: var(--serif); font-size: 15.5px; line-height: 1.62; color: var(--ink-2); margin: 14px 0 4px; max-width: 68ch; }
.lede em { color: var(--ink); font-style: italic; }

/* ------------------------------------------------------------------- cards - */
.card {
  background: var(--surface); border: 1px solid var(--rule); border-radius: 5px;
  padding: 16px 18px; min-width: 0;
}
.card.pad0 { padding: 0; }
.card-t { font-size: 13.5px; font-weight: 600; }
.card-s { font-size: 12.5px; color: var(--ink-3); margin-top: 3px; line-height: 1.5; }
.grid { display: grid; gap: 14px; margin-top: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
.g21 { grid-template-columns: 2fr 1fr; }
.g12 { grid-template-columns: 1fr 2fr; }
@media (max-width: 1080px) { .g3,.g4,.g21,.g12 { grid-template-columns: repeat(2, minmax(0,1fr)); } }
@media (max-width: 720px)  { .grid { grid-template-columns: minmax(0,1fr) !important; } }

/* --------------------------------------------------------------- stat tile - */
.tile { background: var(--surface); border: 1px solid var(--rule); border-radius: 5px; padding: 13px 15px; }
.tile .lab { font-family: var(--mono); font-size: 9.5px; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-3); }
.tile .val { font-family: var(--mono); font-size: 26px; font-weight: 500; letter-spacing: -.02em; margin-top: 7px; font-variant-numeric: tabular-nums; }
.tile .sub { font-size: 12px; color: var(--ink-3); margin-top: 3px; line-height: 1.45; }
.tile.hero { background: var(--accent-sf); border-color: color-mix(in srgb, var(--accent) 32%, transparent); }
.tile.hero .val { color: var(--accent-2); }

/* -------------------------------------------------------------------- pill - */
.pill {
  display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono);
  font-size: 10.5px; font-weight: 500; padding: 2px 7px; border-radius: 3px;
  letter-spacing: .03em; white-space: nowrap;
}
.pill::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
.pill.good { color: var(--good); background: var(--good-sf); }
.pill.warn { color: var(--warn); background: var(--warn-sf); }
.pill.serious { color: var(--serious); background: var(--serious-sf); }
.pill.critical { color: var(--critical); background: var(--critical-sf); }
.pill.neutral { color: var(--ink-2); background: var(--surface-3); }
.pill.accent { color: var(--accent); background: var(--accent-sf); }
.pill.plain::before { display: none; }

/* ------------------------------------------------------------------- table - */
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
th {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink-3); font-weight: 500; white-space: nowrap; background: var(--surface-2);
  position: sticky; top: 0; z-index: 1;
}
tbody tr:hover { background: var(--surface-2); }
td.num, th.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
td.mono { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); }
tr.dim td { color: var(--ink-3); }
.tbl-scroll { max-height: 420px; overflow-y: auto; overflow-x: auto; }

/* -------------------------------------------------------------------- misc - */
.kv { display: grid; grid-template-columns: auto 1fr; gap: 5px 14px; font-size: 12.5px; }
.kv dt { font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); white-space: nowrap; padding-top: 2px; }
.kv dd { margin: 0; color: var(--ink-2); }

.note {
  border-left: 2px solid var(--finding); background: var(--finding-sf);
  padding: 12px 15px; border-radius: 0 4px 4px 0; font-size: 13px; line-height: 1.55; color: var(--ink-2);
}
.note strong { color: var(--ink); font-weight: 600; }
.note.calm { border-left-color: var(--accent); background: var(--accent-sf); }
.note-t { font-family: var(--mono); font-size: 10px; letter-spacing: .13em; text-transform: uppercase; color: var(--finding); margin-bottom: 6px; font-weight: 600; }
.note.calm .note-t { color: var(--accent); }

.mono-block {
  font-family: var(--mono); font-size: 11.5px; line-height: 1.6; background: var(--surface-2);
  border: 1px solid var(--rule); border-radius: 4px; padding: 11px 13px; overflow-x: auto;
  white-space: pre; color: var(--ink-2);
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.sev { border-left: 3px solid var(--rule-2); padding-left: 12px; }
.sev.high, .sev.blocker { border-left-color: var(--critical); }
.sev.medium { border-left-color: var(--warn); }
.sev.low { border-left-color: var(--ink-3); }

.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 11.5px; color: var(--ink-2); margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.swatch { width: 9px; height: 9px; border-radius: 2px; flex: none; }

.chart { width: 100%; display: block; overflow: visible; }
.chart text { font-family: var(--mono); font-size: 9.5px; fill: var(--ink-3); }
.chart .axis-t { font-size: 10px; fill: var(--ink-2); }
.chart .gridline { stroke: var(--grid); stroke-width: 1; }
.chart .axisline { stroke: var(--rule-2); stroke-width: 1; }

.tip {
  position: fixed; pointer-events: none; z-index: 60; background: var(--surface);
  border: 1px solid var(--rule-2); border-radius: 4px; padding: 7px 10px; font-size: 11.5px;
  font-family: var(--mono); color: var(--ink); box-shadow: 0 6px 20px rgba(0,0,0,.14);
  opacity: 0; transition: opacity .09s; max-width: 320px; line-height: 1.5;
}
.tip.on { opacity: 1; }
.tip b { color: var(--accent-2); font-weight: 600; }

.seg-dot { width: 10px; height: 10px; border-radius: 2px; display: inline-block; vertical-align: -1px; }
.toggle { display: inline-flex; border: 1px solid var(--rule-2); border-radius: 4px; overflow: hidden; }
.toggle button {
  font-family: var(--mono); font-size: 11px; padding: 4px 11px; background: var(--surface);
  border: 0; color: var(--ink-2); cursor: pointer; border-right: 1px solid var(--rule);
}
.toggle button:last-child { border-right: 0; }
.toggle button.on { background: var(--accent); color: #fff; }
:root[data-theme="dark"] .toggle button.on, :root:not([data-theme="light"]) .toggle button.on { color: #061114; }

.flow { display: flex; align-items: stretch; gap: 0; flex-wrap: wrap; font-family: var(--mono); font-size: 11px; }
.flow .step {
  background: var(--surface-2); border: 1px solid var(--rule); padding: 7px 11px;
  border-radius: 3px; color: var(--ink-2);
}
.flow .arrow { display: flex; align-items: center; padding: 0 7px; color: var(--ink-3); }
.flow .step.hi { background: var(--accent-sf); border-color: color-mix(in srgb, var(--accent) 32%, transparent); color: var(--accent-2); font-weight: 500; }

.cite { border-top: 1px solid var(--rule); padding: 13px 0; }
.cite:first-child { border-top: 0; }
.cite-h { font-family: var(--serif); font-size: 14px; color: var(--ink); }
.cite-h .yr { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); }
.cite-v { font-family: var(--mono); font-size: 11px; color: var(--ink-3); margin-top: 2px; }
.cite-row { display: grid; grid-template-columns: 86px 1fr; gap: 4px 12px; margin-top: 9px; font-size: 12.5px; }
.cite-row dt { font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); padding-top: 3px; }
.cite-row dd { margin: 0; color: var(--ink-2); }
.cite-row dd.impl { font-family: var(--mono); font-size: 11px; color: var(--accent); }
.cite-row dd.dev { font-family: var(--serif); font-style: italic; color: var(--ink-2); }

.bar-row { display: grid; grid-template-columns: 150px 1fr 62px; gap: 10px; align-items: center; font-size: 12px; padding: 3px 0; }
.bar-row .nm { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-track { background: var(--surface-3); border-radius: 2px; height: 9px; position: relative; overflow: hidden; }
.bar-fill { position: absolute; inset: 0 auto 0 0; border-radius: 2px; background: var(--accent); }
.bar-row .vv { font-family: var(--mono); font-size: 11px; text-align: right; color: var(--ink-2); font-variant-numeric: tabular-nums; }

.hr { height: 1px; background: var(--rule); margin: 18px 0; border: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (max-width: 860px) {
  .shell { grid-template-columns: 1fr; }
  .rail { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--rule); }
  .nav { flex-direction: row; flex-wrap: wrap; }
  .nav-group { display: none; }
  .main { padding: 0 18px 80px; }
}
</style>

. Every backward arrow that would normally be tacit (a data-quality finding changing the preparation step) is recorded as an explicit resolution in the audit ledger."},{"key":"auto-weka","authors":"Thornton, C., Hutter, F., Hoos, H. H. & Leyton-Brown, K.","year":2013,"title":"Auto-WEKA: Combined Selection and Hyperparameter Optimization of Classification Algorithms","venue":"KDD 2013","topic":"automl","used_for":"The CASH formulation - treating algorithm choice as one more dimension of the hyperparameter space rather than an outer loop.","implemented_in":"search_space.SPACE (algorithm is a searched dimension); search_space.CONDITIONS encodes the conditional structure","deviation":"Supervised CASH has a loss with an unbiased held-out estimate. Clustering has neither, so the objective is an internal index and the whole result rests on the index being a reasonable proxy - a substantially weaker guarantee, and the reason the evaluation phase leans on stability instead."},{"key":"automl4clust","authors":"Tschechlov, D., Fritz, M. & Schwarz, H.","year":2021,"title":"AutoML4Clust: Efficient AutoML for Clustering Analyses","venue":"EDBT 2021","topic":"automl","used_for":"Carrying CASH to unsupervised learning; optimising CVIs (SIL, CH, DB) as the objective; and the subsample-then-refit cost control.","implemented_in":"autoresearch.Evaluator (search runs on SearchConfig.search_subsample, champion refit on the full book); metrics.score_partition","deviation":"The paper compares random search, Bayesian optimisation, Hyperband and BOHB, and searches algorithm + k. This project searches the preprocessing chain as well - on heavy-tailed financial data the transform choice moves the objective more than the algorithm does - and uses hill climbing with random search as the control arm."},{"key":"ml2dac","authors":"Treder-Tschechlov, D., Fritz, M., Schwarz, H. & Mitschang, B.","year":2023,"title":"ML2DAC: Meta-Learning to Democratize AutoML for Clustering Analysis","venue":"SIGMOD 2023","topic":"automl","used_for":"The argument that CVI *selection* is itself a decision that biases the result, which motivates the calibrated composite over a single index.","implemented_in":"metrics.ObjectiveCalibration, metrics.COMPOSITE_WEIGHTS","deviation":"ML2DAC learns which CVI to use from a meta-knowledge base of prior datasets. No such base exists here, so the three indices are combined with fixed, stated weights instead of selected - simpler, and honest about the fact that the weighting is a judgement."},{"key":"fanova","authors":"Hutter, F., Hoos, H. & Leyton-Brown, K.","year":2014,"title":"An Efficient Approach for Assessing Hyperparameter Importance","venue":"ICML 2014","topic":"automl","used_for":"Attributing objective variance to individual search dimensions - which decisions in the pipeline actually mattered.","implemented_in":"autoresearch.dimension_importance","deviation":"fANOVA fits a random forest over the space and marginalises properly. This is a one-way eta-squared over observed trials, which is cheaper and biased by the optimiser's own sampling. The random-search arm is pooled in to dilute that bias, and the panel states the caveat rather than hiding it."},{"key":"tabu","authors":"Glover, F.","year":1986,"title":"Future Paths for Integer Programming and Links to Artificial Intelligence","venue":"Computers & Operations Research 13(5)","topic":"search","used_for":"Short-term memory preventing the climber from cycling on a plateau.","implemented_in":"autoresearch.hill_climb (deque `tabu`, SearchConfig.tabu_size)","deviation":"Attribute-level tabu tenure is replaced by whole-configuration hashing, which is coarser but exact for a conditional space where 'the same attribute' is not always well defined."},{"key":"gsat","authors":"Selman, B., Levesque, H. & Mitchell, D.","year":1992,"title":"A New Method for Solving Hard Satisfiability Problems","venue":"AAAI 1992","topic":"search","used_for":"Sideways (non-worsening) moves as the mechanism for crossing plateaus, and random restarts as the mechanism for escaping local optima.","implemented_in":"autoresearch.hill_climb (accept_sideways branch, SearchConfig.restarts)","deviation":"Plateaus here come from categorical dimensions with no effect on the current pipeline (e.g. changing `init` under a non-KMeans algorithm), so the sideways budget is small and per-restart."},{"key":"vns","authors":"Mladenovic, N. & Hansen, P.","year":1997,"title":"Variable Neighborhood Search","venue":"Computers & Operations Research 24(11)","topic":"search","used_for":"Biasing neighbourhood sampling toward dimensions that have historically produced improvements.","implemented_in":"autoresearch.hill_climb (`dim_credit`), search_space.neighbours(dim_weights=)","deviation":"Formal VNS systematically enlarges the neighbourhood radius; here the radius stays at one dimension and only the sampling distribution adapts."},{"key":"constraints","authors":"Coello Coello, C. A.","year":2002,"title":"Theoretical and Numerical Constraint-Handling Techniques used with Evolutionary Algorithms","venue":"Computer Methods in Applied Mechanics and Engineering 191(11-12)","topic":"search","used_for":"Static-penalty constraint handling, so that any feasible solution strictly dominates any infeasible one while infeasible ones keep a gradient.","implemented_in":"metrics.INFEASIBLE_SHIFT, metrics.score_partition","deviation":"None material. The shift is set to the maximum attainable raw objective (1.0), which makes the ordering exactly lexicographic."},{"key":"silhouette","authors":"Rousseeuw, P. J.","year":1987,"title":"Silhouettes: A Graphical Aid to the Interpretation and Validation of Cluster Analysis","venue":"Journal of Computational and Applied Mathematics 20","topic":"validity","used_for":"Primary internal index and the per-sample silhouette diagnostic.","implemented_in":"metrics.internal_indices, metrics.silhouette_profile","deviation":"Computed on a seeded subsample above 2,500 points (the index is O(n^2)). The dashboard shows the per-cluster distribution, not only the mean, because that is what Rousseeuw's original diagnostic is for."},{"key":"ch","authors":"Calinski, T. & Harabasz, J.","year":1974,"title":"A Dendrite Method for Cluster Analysis","venue":"Communications in Statistics 3(1)","topic":"validity","used_for":"Variance-ratio criterion; second component of the composite objective.","implemented_in":"metrics.internal_indices, metrics.ObjectiveCalibration","deviation":"CH is unbounded, so it cannot be averaged with a bounded index directly. It is mapped through ch/(ch+kappa) with kappa frozen from a calibration draw before the search, keeping the objective stationary."},{"key":"db","authors":"Davies, D. L. & Bouldin, D. W.","year":1979,"title":"A Cluster Separation Measure","venue":"IEEE TPAMI 1(2)","topic":"validity","used_for":"Within-to-between scatter ratio; third component of the composite.","implemented_in":"metrics.internal_indices","deviation":"Inverted to 1/(1+DB) so that, like the others, larger is better."},{"key":"arbelaitz","authors":"Arbelaitz, O., Gurrutxaga, I., Muguerza, J., Perez, J. M. & Perona, I.","year":2013,"title":"An Extensive Comparative Study of Cluster Validity Indices","venue":"Pattern Recognition 46(1)","topic":"validity","used_for":"Justifying *which* three indices to use, rather than picking the familiar one.","implemented_in":"metrics module docstring; choice of SIL / CH / DB","deviation":"The study evaluates 30 indices on data with known ground truth. No ground truth exists here, so its ranking is imported as prior evidence, not re-derived."},{"key":"milligan","authors":"Milligan, G. W. & Cooper, M. C.","year":1985,"title":"An Examination of Procedures for Determining the Number of Clusters in a Data Set","venue":"Psychometrika 50(2)","topic":"validity","used_for":"The documented bias of stopping rules toward small k - the reason the objective is constrained and the k-sweep is reported in full.","implemented_in":"evaluate.k_sweep; config.SearchConfig.min_k_business","deviation":"Their comparison is on well-separated synthetic data. On this book the bias is confirmed empirically in the k-sweep panel rather than assumed."},{"key":"vendramin","authors":"Vendramin, L., Campello, R. J. G. B. & Hruschka, E. R.","year":2010,"title":"Relative Clustering Validity Criteria: A Comparative Overview","venue":"Statistical Analysis and Data Mining 3(4)","topic":"validity","used_for":"The general result that no single relative criterion dominates, motivating a weighted combination plus constraints.","implemented_in":"metrics.COMPOSITE_WEIGHTS","deviation":"Weights are asserted (0.50/0.30/0.20) and stated, not learned. Sensitivity to them is bounded by the leaderboard, which shows the top configurations under the composite alongside their individual indices."},{"key":"benhur","authors":"Ben-Hur, A., Elisseeff, A. & Guyon, I.","year":2002,"title":"A Stability Based Method for Discovering Structure in Clustered Data","venue":"Pacific Symposium on Biocomputing","topic":"stability","used_for":"Resampling stability as the primary evidence that structure is real.","implemented_in":"evaluate.stability","deviation":"The paper compares two independent subsamples on their overlap. Here every replicate is compared to the full-data reference partition, which is the quantity actually of interest in deployment ('would this month's refit reproduce the segments we are campaigning against?')."},{"key":"lange","authors":"Lange, T., Roth, V., Braun, M. L. & Buhmann, J. M.","year":2004,"title":"Stability-Based Validation of Clustering Solutions","venue":"Neural Computation 16(6)","topic":"stability","used_for":"Using an inductive extension of a transductive clustering to transfer labels between resamples - exactly what deployment also requires.","implemented_in":"models.InductiveAssigner (and its reported fidelity_)","deviation":"They train a classifier as the extension operator; here it is a nearest-centroid rule, which is weaker but has no hyperparameters of its own to confound the stability estimate, and is the rule that actually ships."},{"key":"vonluxburg-stability","authors":"von Luxburg, U.","year":2010,"title":"Clustering Stability: An Overview","venue":"Foundations and Trends in Machine Learning 2(3)","topic":"stability","used_for":"The caution that stability is not a monotone signal for k and can be high for the wrong reasons.","implemented_in":"evaluate.k_sweep (stability reported per k, never used alone)","deviation":"Treated as one of three converging lines of evidence for k, alongside the constrained objective and the gap statistic."},{"key":"hennig","authors":"Hennig, C.","year":2007,"title":"Cluster-wise Assessment of Cluster Stability","venue":"Computational Statistics & Data Analysis 52(1)","topic":"stability","used_for":"Per-cluster bootstrap Jaccard and the 0.60 / 0.85 interpretation bands (SC-2) - a partition can be stable on average and still contain a segment that dissolves.","implemented_in":"evaluate.stability (per_cluster_jaccard)","deviation":"Subsampling without replacement rather than the bootstrap, to avoid duplicate points inflating the apparent compactness of a cluster."},{"key":"hubert","authors":"Hubert, L. & Arabie, P.","year":1985,"title":"Comparing Partitions","venue":"Journal of Classification 2(1)","topic":"stability","used_for":"Adjusted Rand Index for partition agreement across resamples.","implemented_in":"evaluate.stability, evaluate.k_sweep","deviation":"None."},{"key":"vinh","authors":"Vinh, N. X., Epps, J. & Bailey, J.","year":2010,"title":"Information Theoretic Measures for Clusterings Comparison","venue":"JMLR 11","topic":"stability","used_for":"NMI as a second agreement measure with different bias to ARI.","implemented_in":"evaluate.stability","deviation":"Reported alongside ARI, not instead of it; the paper's point is precisely that the choice of measure is not neutral."},{"key":"tibshirani","authors":"Tibshirani, R., Walther, G. & Hastie, T.","year":2001,"title":"Estimating the Number of Clusters in a Data Set via the Gap Statistic","venue":"JRSS-B 63(2)","topic":"validity","used_for":"An independent, null-referenced read on k.","implemented_in":"evaluate.gap_statistic","deviation":"Uses the paper's PCA-aligned uniform reference, with a smaller number of Monte-Carlo draws than recommended for budget reasons; s_k is reported so the resulting uncertainty is visible."},{"key":"hopkins","authors":"Lawson, R. G. & Jurs, P. C.","year":1990,"title":"New Index for Clustering Tendency and its Application to Chemical Problems","venue":"Journal of Chemical Information and Computer Sciences 30(1)","topic":"validity","used_for":"Testing before modelling whether the data is clusterable at all.","implemented_in":"data.clustering_tendency","deviation":"Sampling-based estimate over a 5% sample; the statistic is sensitive to the sampling window, so it is read as a coarse go/no-go, not a p-value."},{"key":"gmm","authors":"Fraley, C. & Raftery, A. E.","year":1998,"title":"How Many Clusters? Which Clustering Method? Answers Via Model-Based Cluster Analysis","venue":"The Computer Journal 41(8)","topic":"algorithms","used_for":"Model-based clustering as a family with a different inductive bias to k-means (elliptical, unequal-covariance clusters).","implemented_in":"models.build_clusterer (GaussianMixture, covariance searched)","deviation":"Model selection is by the shared composite objective rather than BIC, so that every algorithm in the zoo is judged on identical terms."},{"key":"hdbscan","authors":"Campello, R. J. G. B., Moulavi, D. & Sander, J.","year":2013,"title":"Density-Based Clustering Based on Hierarchical Density Estimates","venue":"PAKDD 2013","topic":"algorithms","used_for":"A density family that can decline to assign points, as a check on whether the partition-forcing families are inventing structure.","implemented_in":"models.build_clusterer (sklearn.cluster.HDBSCAN)","deviation":"Noise fraction is penalised in the objective: an unassigned account still has to receive a treatment, so a solution that abstains on a third of the book is not usable however clean the remainder looks."},{"key":"spectral","authors":"von Luxburg, U.","year":2007,"title":"A Tutorial on Spectral Clustering","venue":"Statistics and Computing 17(4)","topic":"algorithms","used_for":"A graph-based family able to find non-convex structure.","implemented_in":"models.build_clusterer (SpectralClustering); models.MAX_N guard","deviation":"Guarded above n=3,000 because the eigendecomposition is super-linear; it therefore competes only during the subsampled search, which is stated rather than left implicit."},{"key":"birch","authors":"Zhang, T., Ramakrishnan, R. & Livny, M.","year":1996,"title":"BIRCH: An Efficient Data Clustering Method for Very Large Databases","venue":"SIGMOD 1996","topic":"algorithms","used_for":"A single-pass hierarchical method as the scalability reference point.","implemented_in":"models.build_clusterer (Birch)","deviation":"None."},{"key":"trepan","authors":"Craven, M. W. & Shavlik, J. W.","year":1995,"title":"Extracting Tree-Structured Representations of Trained Networks","venue":"NIPS 1995","topic":"interpretability","used_for":"The surrogate-tree pattern and, critically, the distinction between fidelity to the model and accuracy against truth.","implemented_in":"profiling.surrogate_rules (reports fidelity, SC-5)","deviation":"A plain CART surrogate rather than TREPAN's oracle-queried induction; the training set is large enough that querying an oracle for synthetic points adds little."},{"key":"tsne","authors":"van der Maaten, L. & Hinton, G.","year":2008,"title":"Visualizing Data using t-SNE","venue":"JMLR 9","topic":"interpretability","used_for":"Local-neighbourhood view of the segments in the scatter panel.","implemented_in":"profiling.projection","deviation":"Shown *beside* PCA and never alone: in t-SNE, between-cluster distance and relative cluster size carry no meaning, and reading it alone is how people convince themselves of clusters that are not there."},{"key":"modelcards","authors":"Mitchell, M., Wu, S., Zaldivar, A., Barnes, P., Vasserman, L., Hutchinson, B., Spitzer, E., Raji, I. D. & Gebru, T.","year":2019,"title":"Model Cards for Model Reporting","venue":"FAT* 2019","topic":"operations","used_for":"The structure of the model card, including intended use, out-of-scope uses, factors and ethical considerations.","implemented_in":"deploy.model_card","deviation":"The 'factors' section is adapted: the file contains no protected attributes, so the section records the *proxy* risk and states that a disparate-impact review cannot be performed from this data at all."},{"key":"sculley","authors":"Sculley, D., Holt, G., Golovin, D., Davydov, E., Phillips, T., Ebner, D., Chaudhary, V., Young, M., Crespo, J.-F. & Dennison, D.","year":2015,"title":"Hidden Technical Debt in Machine Learning Systems","venue":"NIPS 2015","topic":"operations","used_for":"Why feature engineering lives inside the scoring artifact (training/serving skew) and why the monitor watches inputs rather than waiting for outcomes.","implemented_in":"deploy.ScoringArtifact.score (calls fixed_clean internally); deploy.drift_report","deviation":"None."}],"topics":["process","automl","search","validity","stability","algorithms","interpretability","operations"]}}</script>

  : (Math.abs(v) >= 1e6 ? "$" + (v / 1e6).toFixed(2) + "M"
    : Math.abs(v) >= 1e3 ? "$" + (v / 1e3).toFixed(0) + "k" : "$" + Math.round(v));
const SERIES = i => `var(--s${(i % 8) + 1})`;

/* ---- tooltip ---- */
const tipEl = document.getElementById("tip");
function bindTip(node, html) {
  node.addEventListener("pointerenter", e => { tipEl.innerHTML = html; tipEl.classList.add("on"); move(e); });
  node.addEventListener("pointermove", move);
  node.addEventListener("pointerleave", () => tipEl.classList.remove("on"));
  function move(e) {
    const pad = 14, w = tipEl.offsetWidth, h = tipEl.offsetHeight;
    let x = e.clientX + pad, y = e.clientY + pad;
    if (x + w > innerWidth - 8) x = e.clientX - w - pad;
    if (y + h > innerHeight - 8) y = e.clientY - h - pad;
    tipEl.style.left = x + "px"; tipEl.style.top = y + "px";
  }
}

/* ---- section scaffolding ---- */
function section(id, numLabel, title, kicker, lede) {
  const host = document.getElementById(id);
  host.appendChild(el("div", { class: "sec-head" }, [
    numLabel ? el("span", { class: "sec-num", text: numLabel }) : null,
    el("h2", { text: title }),
    kicker ? el("span", { class: "sec-kicker", text: kicker }) : null,
  ]));
  if (lede) host.appendChild(el("p", { class: "lede", html: lede }));
  return host;
}
const card = (title, sub, body, cls = "") => {
  const c = el("div", { class: "card " + cls });
  if (title) c.appendChild(el("div", { class: "card-t", text: title }));
  if (sub) c.appendChild(el("div", { class: "card-s", html: sub }));
  if (body) { const w = el("div"); w.style.marginTop = title ? "12px" : "0"; w.appendChild(body); c.appendChild(w); }
  return c;
};
const tile = (lab, val, sub, hero) => el("div", { class: "tile" + (hero ? " hero" : "") }, [
  el("div", { class: "lab", text: lab }),
  el("div", { class: "val", text: val }),
  sub ? el("div", { class: "sub", html: sub }) : null,
]);
const grid = (cls, kids) => el("div", { class: "grid " + cls }, kids);
const pill = (txt, kind = "neutral", plain = false) =>
  el("span", { class: `pill ${kind}${plain ? " plain" : ""}`, text: txt });
const note = (label, html, calm = false) => el("div", { class: "note" + (calm ? " calm" : "") }, [
  label ? el("div", { class: "note-t", text: label }) : null, el("div", { html }),
]);

function table(cols, rows, opts = {}) {
  const wrap = el("div", { class: opts.scroll ? "tbl-scroll" : "tbl-wrap" });
  const t = el("table");
  t.appendChild(el("thead", {}, el("tr", {}, cols.map(c =>
    el("th", { class: c.num ? "num" : "", text: c.label })))));
  const tb = el("tbody");
  rows.forEach(r => {
    const tr = el("tr", { class: r.__dim ? "dim" : "" });
    cols.forEach(c => {
      const v = c.get(r);
      tr.appendChild(v instanceof Node
        ? el("td", { class: c.cls || (c.num ? "num" : "") }, v)
        : el("td", { class: c.cls || (c.num ? "num" : ""), html: v === undefined || v === null ? "—" : String(v) }));
    });
    tb.appendChild(tr);
  });
  t.appendChild(tb); wrap.appendChild(t); return wrap;
}

/* ======================================================================== *
 * chart primitives - hand-built SVG, no library
 * ======================================================================== */
function frame(w, h, m) {
  const svg = s_("svg", { class: "chart", viewBox: `0 0 ${w} ${h}`, preserveAspectRatio: "xMidYMid meet",
                          role: "img" });
  const iw = w - m.l - m.r, ih = h - m.t - m.b;
  const g = s_("g", { transform: `translate(${m.l},${m.t})` });
  svg.appendChild(g);
  return { svg, g, iw, ih };
}
const scale = (d0, d1, r0, r1) => v => d1 === d0 ? r0 : r0 + (v - d0) / (d1 - d0) * (r1 - r0);

function axes(g, iw, ih, xs, ys, xTicks, yTicks, opts = {}) {
  yTicks.forEach(t => {
    const y = ys(t);
    g.appendChild(s_("line", { x1: 0, x2: iw, y1: y, y2: y, class: "gridline" }));
    g.appendChild(s_("text", { x: -8, y: y + 3.4, "text-anchor": "end" }, String(opts.yfmt ? opts.yfmt(t) : t)));
  });
  xTicks.forEach(t => {
    const x = xs(t.v ?? t);
    g.appendChild(s_("text", { x, y: ih + 15, "text-anchor": "middle" }, String(t.l ?? t)));
  });
  g.appendChild(s_("line", { x1: 0, x2: iw, y1: ih, y2: ih, class: "axisline" }));
  if (opts.ylab) g.appendChild(s_("text", { x: 0, y: -10, "text-anchor": "start", class: "axis-t" }, opts.ylab));
}
const ticks = (lo, hi, n = 5) => {
  if (!(hi > lo)) return [lo];
  const raw = (hi - lo) / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw) ?? mag * 10;
  const out = []; for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(10));
  return out;
};
const path = pts => pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(2) + " " + p[1].toFixed(2)).join(" ");
</script>
<script>
"use strict";
/* ======================================================================== *
 * chart forms
 * ======================================================================== */
/* Multi-series line. Used for anytime curves, gap statistic, restart traces. */
function lineChart(opts) {
  const { series, w = 720, h = 250, xlab, ylab, xfmt = String, yfmt = v => num(v, 2),
          band = null, dots = false } = opts;
  const m = { t: 18, r: 14, b: 30, l: 46 };
  const { svg, g, iw, ih } = frame(w, h, m);
  const xsAll = series.flatMap(s => s.pts.map(p => p[0]));
  const ysAll = series.flatMap(s => s.pts.map(p => p[1])).concat(band ? band.flatMap(b => [b[1], b[2]]) : []);
  const x0 = Math.min(...xsAll), x1 = Math.max(...xsAll);
  let y0 = Math.min(...ysAll), y1 = Math.max(...ysAll);
  const padY = (y1 - y0) * 0.12 || 0.1; y0 -= padY; y1 += padY;
  const xs = scale(x0, x1, 0, iw), ys = scale(y0, y1, ih, 0);
  axes(g, iw, ih, xs, ys, ticks(x0, x1, 6).map(v => ({ v, l: xfmt(v) })), ticks(y0, y1, 5), { yfmt, ylab });
  if (band) {
    const up = band.map(b => [xs(b[0]), ys(b[2])]), dn = band.map(b => [xs(b[0]), ys(b[1])]).reverse();
    g.appendChild(s_("path", { d: path(up.concat(dn)) + " Z", fill: series[0].color, opacity: .12 }));
  }
  series.forEach(sr => {
    g.appendChild(s_("path", { d: path(sr.pts.map(p => [xs(p[0]), ys(p[1])])), fill: "none",
      stroke: sr.color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round",
      "stroke-dasharray": sr.dash || null, opacity: sr.opacity ?? 1 }));
    if (dots || sr.dots) sr.pts.forEach(p => {
      const c = s_("circle", { cx: xs(p[0]), cy: ys(p[1]), r: 3.4, fill: sr.color,
        stroke: "var(--surface)", "stroke-width": 2 });
      bindTip(c, `<b>${esc(sr.name)}</b><br>${xlab || "x"} ${xfmt(p[0])}<br>${ylab || "y"} ${yfmt(p[1])}`);
      g.appendChild(c);
    });
    const last = sr.pts[sr.pts.length - 1];
    if (sr.label !== false && last)
      g.appendChild(s_("circle", { cx: xs(last[0]), cy: ys(last[1]), r: 3.2, fill: sr.color,
        stroke: "var(--surface)", "stroke-width": 2 }));
  });
  if (xlab) g.appendChild(s_("text", { x: iw, y: ih + 28, "text-anchor": "end", class: "axis-t" }, xlab));
  return svg;
}

/* Vertical bars with an optional threshold rule. */
function barChart(opts) {
  const { data, w = 720, h = 230, yfmt = v => num(v, 2), color = "var(--accent)",
          thresholds = [], xlab, ylab, rotate = false } = opts;
  const m = { t: 18, r: 14, b: rotate ? 62 : 34, l: 48 };
  const { svg, g, iw, ih } = frame(w, h, m);
  const vals = data.map(d => d.v).concat(thresholds.map(t => t.v));
  let y0 = Math.min(0, ...vals), y1 = Math.max(...vals);
  y1 += (y1 - y0) * 0.12 || 0.1;
  const ys = scale(y0, y1, ih, 0);
  const bw = iw / data.length, pad = Math.min(9, bw * 0.24);
  ticks(y0, y1, 5).forEach(t => {
    g.appendChild(s_("line", { x1: 0, x2: iw, y1: ys(t), y2: ys(t), class: "gridline" }));
    g.appendChild(s_("text", { x: -8, y: ys(t) + 3.4, "text-anchor": "end" }, yfmt(t)));
  });
  data.forEach((d, i) => {
    const x = i * bw + pad / 2, bwid = bw - pad;
    const top = ys(Math.max(d.v, 0)), base = ys(0);
    const r = s_("rect", { x, y: Math.min(top, base), width: bwid, height: Math.max(Math.abs(base - top), 1),
      fill: d.color || color, rx: 3 });
    bindTip(r, d.tip || `<b>${esc(d.l)}</b><br>${yfmt(d.v)}`);
    g.appendChild(r);
    const lt = s_("text", { x: x + bwid / 2, y: ih + (rotate ? 12 : 15),
      "text-anchor": rotate ? "end" : "middle",
      transform: rotate ? `rotate(-40 ${x + bwid / 2} ${ih + 12})` : null }, d.l);
    g.appendChild(lt);
  });
  thresholds.forEach(t => {
    g.appendChild(s_("line", { x1: 0, x2: iw, y1: ys(t.v), y2: ys(t.v), stroke: t.color || "var(--finding)",
      "stroke-width": 1.2, "stroke-dasharray": "4 3" }));
    g.appendChild(s_("text", { x: iw, y: ys(t.v) - 4, "text-anchor": "end", fill: t.color || "var(--finding)" }, t.l));
  });
  g.appendChild(s_("line", { x1: 0, x2: iw, y1: ys(0), y2: ys(0), class: "axisline" }));
  if (ylab) g.appendChild(s_("text", { x: 0, y: -8, class: "axis-t" }, ylab));
  return svg;
}

/* Horizontal bar list in plain HTML - better label handling than SVG. */
function hbars(rows, opts = {}) {
  const { fmt = v => num(v, 3), color = () => "var(--accent)", max } = opts;
  const hi = max ?? Math.max(...rows.map(r => Math.abs(r.v)), 1e-9);
  const box = el("div");
  rows.forEach(r => {
    const f = el("div", { class: "bar-fill" });
    f.style.width = (100 * Math.abs(r.v) / hi) + "%";
    f.style.background = color(r);
    const track = el("div", { class: "bar-track" }, f);
    if (r.tip) bindTip(track, r.tip);
    box.appendChild(el("div", { class: "bar-row" }, [
      el("div", { class: "nm", text: r.l, title: r.l }), track,
      el("div", { class: "vv", text: fmt(r.v) }),
    ]));
  });
  return box;
}

/* Diverging or sequential matrix. */
function heatmap(opts) {
  const { rows, cols, values, w = 720, diverging = true, cell = 22, rowLab = 128,
          fmt = v => num(v, 2), tipFor } = opts;
  const cw = Math.max(16, Math.min(cell, (w - rowLab - 10) / cols.length));
  const h = rows.length * cell + 74;
  const svg = s_("svg", { class: "chart", viewBox: `0 0 ${w} ${h}`, preserveAspectRatio: "xMidYMid meet" });
  const g = s_("g", { transform: `translate(${rowLab},60)` });
  svg.appendChild(g);
  const absMax = Math.max(...values.flat().map(v => Math.abs(v ?? 0)), 1e-9);
  const lo = Math.min(...values.flat().filter(v => v !== null)), hiV = Math.max(...values.flat().filter(v => v !== null));
  const fill = v => {
    if (v === null || v === undefined) return "var(--surface-3)";
    if (diverging) {
      const t = Math.min(Math.abs(v) / absMax, 1);
      return `color-mix(in srgb, ${v >= 0 ? "var(--dv-pos)" : "var(--dv-neg)"} ${(t * 88).toFixed(1)}%, var(--dv-mid))`;
    }
    const t = hiV === lo ? .5 : (v - lo) / (hiV - lo);
    return `color-mix(in srgb, var(--dv-pos) ${(8 + t * 84).toFixed(1)}%, var(--dv-mid))`;
  };
  cols.forEach((c, j) => g.appendChild(s_("text", {
    x: j * cw + cw / 2, y: -8, "text-anchor": "start",
    transform: `rotate(-52 ${j * cw + cw / 2} -8)` }, c)));
  rows.forEach((r, i) => {
    g.appendChild(s_("text", { x: -8, y: i * cell + cell / 2 + 3.4, "text-anchor": "end" }, r));
    cols.forEach((c, j) => {
      const v = values[i][j];
      const rect = s_("rect", { x: j * cw + 1, y: i * cell + 1, width: cw - 2, height: cell - 2,
        rx: 2, fill: fill(v) });
      bindTip(rect, tipFor ? tipFor(i, j, v) : `<b>${esc(r)}</b> × ${esc(c)}<br>${fmt(v)}`);
      g.appendChild(rect);
      if (cw >= 30 && v !== null && v !== undefined)
        g.appendChild(s_("text", { x: j * cw + cw / 2, y: i * cell + cell / 2 + 3.2,
          "text-anchor": "middle", fill: Math.abs(v) / absMax > 0.55 ? "#fff" : "var(--ink-2)",
          "font-size": 8.5 }, fmt(v)));
    });
  });
  return svg;
}

/* Segment scatter. */
function scatterPlot(opts) {
  const { x, y, label, names, w = 720, h = 400, xlab, ylab, r = 2.2 } = opts;
  const m = { t: 16, r: 14, b: 30, l: 44 };
  const { svg, g, iw, ih } = frame(w, h, m);
  const x0 = Math.min(...x), x1 = Math.max(...x), y0 = Math.min(...y), y1 = Math.max(...y);
  const xs = scale(x0, x1, 0, iw), ys = scale(y0, y1, ih, 0);
  axes(g, iw, ih, xs, ys, ticks(x0, x1, 5).map(v => ({ v, l: num(v, 1) })), ticks(y0, y1, 5),
       { yfmt: v => num(v, 1), ylab });
  const byLab = new Map();
  x.forEach((_, i) => { const k = label[i]; if (!byLab.has(k)) byLab.set(k, []); byLab.get(k).push(i); });
  [...byLab.keys()].sort((a, b) => a - b).forEach(k => {
    const idx = byLab.get(k);
    const d = idx.map(i => `M${xs(x[i]).toFixed(1)} ${ys(y[i]).toFixed(1)}m-${r},0a${r},${r} 0 1,0 ${2 * r},0a${r},${r} 0 1,0 -${2 * r},0`).join("");
    const p = s_("path", { d, fill: k < 0 ? "var(--ink-3)" : SERIES(k), opacity: .62 });
    bindTip(p, `<b>${esc(names[k] ?? ("Segment " + k))}</b><br>${idx.length.toLocaleString()} points plotted`);
    g.appendChild(p);
  });
  if (xlab) g.appendChild(s_("text", { x: iw, y: ih + 26, "text-anchor": "end", class: "axis-t" }, xlab));
  return svg;
}

/* Rousseeuw silhouette plot. */
function silhouettePlot(profile, names, w = 720) {
  const per = profile.per_cluster || [];
  const total = per.reduce((a, c) => a + c.curve.length, 0) + per.length * 3;
  const rowH = 2.6, h = Math.max(180, total * rowH + 56);
  const m = { t: 14, r: 14, b: 28, l: 44 };
  const { svg, g, iw, ih } = frame(w, h, m);
  const lo = Math.min(-0.25, ...per.flatMap(c => c.curve)), hi = Math.max(0.6, ...per.flatMap(c => c.curve));
  const xs = scale(lo, hi, 0, iw);
  ticks(lo, hi, 6).forEach(t => {
    g.appendChild(s_("line", { x1: xs(t), x2: xs(t), y1: 0, y2: ih, class: "gridline" }));
    g.appendChild(s_("text", { x: xs(t), y: ih + 15, "text-anchor": "middle" }, num(t, 2)));
  });
  g.appendChild(s_("line", { x1: xs(0), x2: xs(0), y1: 0, y2: ih, class: "axisline" }));
  let y = 4;
  per.forEach(c => {
    const grp = s_("g");
    c.curve.forEach(v => {
      grp.appendChild(s_("rect", { x: Math.min(xs(0), xs(v)), y, width: Math.abs(xs(v) - xs(0)),
        height: rowH - 0.5, fill: SERIES(c.cluster), opacity: v < 0 ? .45 : .85 }));
      y += rowH;
    });
    bindTip(grp, `<b>${esc(names[c.cluster] ?? ("Segment " + c.cluster))}</b><br>n = ${c.n.toLocaleString()}<br>mean s = ${num(c.mean, 3)}<br>${num(c.pct_negative, 1)}% negative`);
    g.appendChild(grp);
    g.appendChild(s_("text", { x: -8, y: y - c.curve.length * rowH / 2 + 3, "text-anchor": "end",
      fill: SERIES(c.cluster) }, String(c.cluster)));
    y += 3 * rowH;
  });
  if (Number.isFinite(profile.overall))
    g.appendChild(s_("line", { x1: xs(profile.overall), x2: xs(profile.overall), y1: 0, y2: ih,
      stroke: "var(--finding)", "stroke-width": 1.2, "stroke-dasharray": "4 3" }));
  g.appendChild(s_("text", { x: iw, y: ih + 26, "text-anchor": "end", class: "axis-t" },
    "silhouette s(i) — dashed rule = partition mean"));
  return svg;
}

/* Sparkline histogram for the feature table. */
function sparkHist(hist, w = 96, h = 22) {
  const svg = s_("svg", { class: "chart", viewBox: `0 0 ${w} ${h}`, width: w, height: h });
  const mx = Math.max(...hist.counts, 1), bw = w / hist.counts.length;
  hist.counts.forEach((c, i) => svg.appendChild(s_("rect", {
    x: i * bw, y: h - (c / mx) * h, width: Math.max(bw - 0.6, 0.6), height: Math.max((c / mx) * h, 0.6),
    fill: "var(--accent)", opacity: .55 })));
  return svg;
}

function legendFor(names, ids) {
  return el("div", { class: "legend" }, ids.map(k => {
    const sw = el("span", { class: "swatch" }); sw.style.background = k < 0 ? "var(--ink-3)" : SERIES(k);
    return el("span", {}, [sw, document.createTextNode(names[k] ?? ("Segment " + k))]);
  }));
}

{

    card("Deployed pipeline", DEP.differs_from_champion
        ? `The ${esc(DEP.role)}. The objective-optimal champion found by the search is a different pipeline that fails the charter — see Evaluation.`
        : `Selected by ${CH.source.replace("_", " ")}, then refit and re-ranked on the full book.`,
      (() => {
