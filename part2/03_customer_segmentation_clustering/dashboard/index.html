        const flow = el("div", { class: "flow" });
        steps[0].split("|").map(x => x.trim()).forEach((x, i, arr) => {
          flow.appendChild(el("div", { class: "step", text: x }));
          flow.appendChild(el("div", { class: "arrow", text: "→" }));
        });
        flow.appendChild(el("div", { class: "step hi", text: steps[1].trim() }));
        box.appendChild(flow);
        const dl = el("dl", { class: "kv" });
        [["Role", DEP.role], ["Achieved k", CM.k],
         ["Davies–Bouldin", num(CM.davies_bouldin, 3)],
         ["Calinski–Harabasz", num(CM.calinski_harabasz, 0)],
         ["Balance entropy", num(CM.balance_entropy, 3)],
         ["Inductive fidelity", pct(DEP.inductive_fidelity, 2) + " — agreement of the deployable nearest-centroid rule with the fitted labels"],
        ].forEach(([k, v]) => { dl.appendChild(el("dt", { text: k })); dl.appendChild(el("dd", { text: String(v) })); });
        const w = el("div"); w.style.marginTop = "12px"; w.appendChild(dl); box.appendChild(w);
        return box;
      })()),
    card("Verdict", null, (() => {
      const box = el("div");
      P5.success_criteria.forEach(c => {
        const row = el("div"); row.style.cssText = "display:flex;gap:8px;align-items:baseline;padding:5px 0;border-top:1px solid var(--rule)";
        row.appendChild(pill(c.id, c.passed ? "good" : "critical"));
        row.appendChild(el("div", { html: `<div style="font-size:12.5px">${esc(c.criterion)}</div>` }));
        box.appendChild(row);
      });
      return box;
    })()),
  ]));

  if (P5.search_value)
    h.appendChild(el("div", { style: "margin-top:14px" }, note("What the search bought",
      `<strong>${esc(P5.search_value.verdict)}</strong> Champion objective ${num(P5.search_value.champion_objective, 4)} ` +
      `against ${num(P5.search_value.best_baseline_objective, 4)} for the strongest hand-built pipeline ` +
      `(“${esc(P5.search_value.best_baseline)}”), a gain of ${num(P5.search_value.gain_over_best_baseline, 4)}. ` +
      `Against the textbook default — StandardScaler and KMeans on the raw columns — the gain is ` +
      `${num(P5.search_value.gain_over_textbook_default, 4)}.`)));
}

/* ============================================================== BUSINESS == */
{
  const h = section("business", "Phase 1", "Business Understanding", "charter fixed before the data was opened",
    P1.business_objective);
  h.appendChild(grid("g2", [
    card("The problem", null, el("p", { class: "lede", style: "margin:0;font-size:14px", text: P1.problem })),
    card("Data-mining goal", null, el("div", {}, [
      el("p", { style: "font-size:13px;color:var(--ink-2)", text: P1.data_mining_goal }),
      el("p", { style: "font-size:13px;color:var(--ink-2);margin-top:10px", text: P1.why_unsupervised }),
    ])),
  ]));
  h.appendChild(grid("g2", [
    card("Success criteria", "Set in advance. Phase 5 grades against them without adjustment.",
      table([
        { label: "ID", get: r => r.id, cls: "mono" },
        { label: "Criterion", get: r => esc(r.criterion) },
        { label: "Why this bar", get: r => `<span style="color:var(--ink-3)">${esc(r.rationale)}</span>` },
      ], P1.success_criteria)),
    card("Stakeholders & constraints", null, (() => {
      const box = el("div");
      P1.stakeholders.forEach(s => box.appendChild(el("div", { style: "padding:6px 0;border-top:1px solid var(--rule)" }, [
        el("div", { style: "font-size:12.5px;font-weight:500", text: s.role }),
        el("div", { style: "font-size:12.5px;color:var(--ink-3)", text: s.needs }),
      ])));
      const ul = el("ul", { style: "margin:14px 0 0;padding-left:18px;font-size:12.5px;color:var(--ink-2);line-height:1.6" });
      P1.constraints_and_risks.forEach(c => ul.appendChild(el("li", { text: c })));
      box.appendChild(el("div", { class: "note-t", style: "margin-top:14px", text: "Constraints & risks" }));
      box.appendChild(ul);
      return box;
    })()),
  ]));
}

/* ================================================================== DATA == */
{
  const pr = P2.profile, tend = P2.clustering_tendency;
  const h = section("data", "Phase 2", "Data Understanding", `${P2.quality_issues.length} quality findings`,
    `Six months of behaviour for ${pr.n_rows.toLocaleString()} active cardholders across ${pr.n_features} fields. ` +
    `Before any modelling, two questions: <em>is there structure here at all</em>, and <em>what is wrong with the data</em>.`);

  h.appendChild(grid("g4", [
    tile("Hopkins statistic", num(tend.hopkins, 3), `${esc(tend.interpretation)} — 0.5 would mean uniform noise`, true),
    tile("Records", pr.n_rows.toLocaleString(), `${pr.memory_mb} MB in memory`),
    tile("Effective dimensions", String(pr.pca_scree.n_kaiser), `Kaiser criterion; ${pr.pca_scree.n_90pct} components carry 90% of variance`),
    tile("Missing cells", P2.profile.features.reduce((a, f) => a + f.missing, 0).toLocaleString(),
      `concentrated in MINIMUM_PAYMENTS (${num(pr.features.find(f => f.feature === "MINIMUM_PAYMENTS").missing_pct, 2)}%)`),
  ]));

  h.appendChild(grid("", [card("Feature profile",
    "Distributions are drawn to the 99.5th percentile — at full range every monetary histogram is a single bar at zero with an invisible tail, which is itself the finding.",
    table([
      { label: "Feature", get: r => `<span class="mono" style="font-size:11.5px">${esc(r.feature)}</span><div style="color:var(--ink-3);font-size:11px;max-width:34ch">${esc(r.description)}</div>` },
      { label: "Kind", get: r => `<span class="pill neutral plain">${esc(r.kind)}</span>` },
      { label: "Distribution", get: r => sparkHist(r.histogram) },
      { label: "Median", num: true, get: r => num(r.median, 2) },
      { label: "p95", num: true, get: r => num(r.p95, 1) },
      { label: "Max", num: true, get: r => num(r.max, 0) },
      { label: "Skew", num: true, get: r => `<span style="color:${Math.abs(r.skew) > 3 ? "var(--finding)" : "var(--ink-2)"}">${num(r.skew, 1)}</span>` },
      { label: "Zeros", num: true, get: r => num(r.zeros_pct, 0) + "%" },
      { label: "Missing", num: true, get: r => r.missing ? `<span style="color:var(--finding)">${num(r.missing_pct, 2)}%</span>` : "—" },
      { label: "Top 1% share", num: true, get: r => num(r.top1pct_share, 0) + "%" },
    ], pr.features, { scroll: true }))]));

  h.appendChild(grid("g21", [
    card("Rank correlation", "Spearman, so the monotone relationships survive the skew that would break Pearson here.",
      heatmap({ rows: pr.correlation.labels, cols: pr.correlation.labels, values: pr.correlation.matrix,
        cell: 20, rowLab: 190, w: 720 })),
    card("Redundancy", "The strongest pairs — every one of them is a reason the raw 17 columns are not 17 independent facts.",
      hbars(pr.correlation.top_pairs.slice(0, 9).map(p => ({ l: `${p.a} ~ ${p.b}`, v: p.rho })),
        { fmt: v => num(v, 2), color: r => r.v >= 0 ? "var(--dv-pos)" : "var(--dv-neg)", max: 1 })),
  ]));

  h.appendChild(grid("", [card("Data quality audit",
    "Every finding names the Phase-3 action that answers it. A finding with no stated resolution is an unmanaged risk, so the audit refuses to emit one.",
    (() => {
      const box = el("div");
      const order = { blocker: 0, high: 1, medium: 2, low: 3 };
      [...P2.quality_issues].sort((a, b) => order[a.severity] - order[b.severity]).forEach(i => {
        const w = el("div", { class: "sev " + i.severity, style: "padding:9px 0 9px 12px;margin-top:8px" });
        w.appendChild(el("div", { style: "display:flex;gap:8px;align-items:baseline;flex-wrap:wrap" }, [
          pill(i.id, i.severity === "low" ? "neutral" : i.severity === "medium" ? "warn" : "critical"),
          el("span", { class: "mono", style: "font-size:11.5px;color:var(--ink-2)", text: i.feature }),
          el("span", { style: "font-size:12.5px;font-weight:500", text: i.finding }),
        ]));
        w.appendChild(el("div", { style: "font-size:12px;color:var(--ink-3);margin-top:3px", text: "Evidence: " + i.evidence }));
        w.appendChild(el("div", { style: "font-size:12.5px;color:var(--ink-2);margin-top:4px", text: "→ " + i.resolution }));
        box.appendChild(w);
      });
      return box;
    })())]));
}

/* =============================================================== PREPARE == */
{
  const h = section("prepare", "Phase 3", "Data Preparation", `${P3.ledger.actions.length} logged actions`,
    `Two layers, deliberately separated. Repairs that are <em>not negotiable</em> happen once, before the search — ` +
    `otherwise the optimiser can tune a data-quality defect into a feature. Everything genuinely uncertain ` +
    `(imputation, transform, scaling, reduction) becomes a searched hyperparameter instead of an assumption.`);

  h.appendChild(grid("g2", [
    card("Variance-stabilising transform", "Mean |skewness| across the 17 source features. Distance-based clustering on the untransformed columns is dominated by a handful of whales.",
      barChart({ data: P3.transform_effect.map(t => ({ l: t.transform, v: t.mean_abs_skew,
          color: t.transform === CH.config.transform ? "var(--accent)" : "var(--surface-3)",
          tip: `<b>${t.transform}</b><br>mean |skew| ${num(t.mean_abs_skew, 2)}<br>max |skew| ${num(t.max_abs_skew, 2)}` })),
        h: 200, w: 420, ylab: "mean |skewness|", yfmt: v => num(v, 1) })),
    card("Fixed cleaning ledger", "What changed, on how many records, and why.",
      table([
        { label: "Action", get: r => `<span class="mono" style="font-size:11px">${esc(r.action)}</span>` },
        { label: "Feature", get: r => esc(r.feature) },
        { label: "Rows", num: true, get: r => r.affected.toLocaleString() },
        { label: "Detail", get: r => `<span style="color:var(--ink-3)">${esc(r.detail)}</span>` },
      ], P3.ledger.actions, { scroll: true })),
  ]));

  h.appendChild(grid("g2", [
    card("Engineered features", `${P3.ledger.engineered_features.length} ratios derived once and offered to the search. Ratios are capped at their 99.5th percentile — a denominator near zero otherwise produces a value that dominates every distance in the matrix.`,
      el("div", { class: "chips" }, P3.ledger.engineered_features.map(f => pill(f, "accent", true)))),
    card("Feature views", "“Use every column” is a hypothesis, not a default, so the view is itself a searched dimension.",
      table([
        { label: "View", get: r => `<span class="mono">${esc(r[0])}</span>` },
        { label: "Columns", num: true, get: r => r[1] },
        { label: "", get: r => r[0] === CH.config.feature_view ? '<span class="pill accent">champion</span>' : "" },
      ], Object.entries(P3.feature_views))),
  ]));
}
</script>
<script>
"use strict";
/* ================================================================= MODEL == */
{
  const hc = P4.hill_climb, rs = P4.random_search, ev = P4.evaluator_hill_climb, ev2 = P4.evaluator_random_search;
  const h = section("model", "Phase 4", "Modeling · AutoResearch", `${P4.trials.length} logged trials`,
    `Algorithm choice and preprocessing are optimised jointly as one conditional space — the CASH formulation ` +
    `(Thornton et al., 2013) carried to clustering by AutoML4Clust (Tschechlov et al., 2021). ` +
    `The optimiser is an <em>iterated local search</em>: random restarts, single-dimension moves, ` +
    `plateau traversal and a tabu memory. Random search over the identical space and budget is the control arm — ` +
    `a search reported without one is a number, not a finding.`);

  h.appendChild(grid("g4", [
    tile("Search space", P4.space.total_configurations.toLocaleString(),
      `${P4.space.preprocessing_combinations.toLocaleString()} preprocessing × ${P4.space.model_combinations.toLocaleString()} model settings across ${P4.space.n_dimensions} dimensions`, true),
    tile("Hill climb best", num(hc.best_objective, 4), `${hc.restarts.length} restarts · ${ev.unique_evaluations} evaluations · ${hc.wall_seconds}s`),
    tile("Random search best", num(rs.best_objective, 4), `${ev2.unique_evaluations} evaluations · ${rs.wall_seconds}s`),
    tile("Preprocessing cache", pct(ev.preprocessing_cache_hit_rate, 0),
      `${ev.distinct_preprocessing_chains} distinct chains reused across ${ev.unique_evaluations} fits · ${pct(ev.failure_rate, 1)} of configs failed to fit`),
  ]));

  /* --- the methodological centrepiece --- */
  h.appendChild(el("div", { style: "margin-top:16px" }, note("The decision that makes the rest of it mean anything",
    `A candidate is <strong>never scored in the space it chose for itself</strong>. Every partition is judged on the ` +
    `geometry its labels induce in one fixed space no candidate can influence — all 17 source features, ` +
    `median-imputed, Yeo-Johnson transformed, standardised, no reduction.<br><br>` +
    `Without that separation the search stops optimising cluster structure and starts optimising the scoring space: ` +
    `projecting to two principal components discards exactly the variance that would have made the clusters overlap. ` +
    `An earlier run of this study did precisely that — it selected <span class="mono">pca_n2</span> and reported a ` +
    `silhouette of <strong>0.68</strong> that was <strong>0.195</strong> when the same labels were scored against the real features. ` +
    `The panel below measures the size of that prize across every trial in this run.`)));

  h.appendChild(grid("g21", [
    card("Anytime performance", "Best objective found so far against evaluations spent. Comparing only final scores hides an optimiser that needed ten times the budget to get there.",
      lineChart({ w: 700, h: 260, xlab: "evaluations", ylab: "best objective so far",
        xfmt: v => String(Math.round(v)),
        series: [
          { name: "Hill climb", color: "var(--s1)", pts: P4.anytime.hill_climb.map((v, i) => [i + 1, v]) },
          { name: "Random search", color: "var(--s2)", dash: "5 3", pts: P4.anytime.random_search.map((v, i) => [i + 1, v]) },
        ] })),
    card("Read", null, (() => {
      const gap = hc.best_objective - rs.best_objective;
      const speed = rs.wall_seconds / Math.max(hc.wall_seconds, 1e-9);
      return el("div", { style: "font-size:12.5px;color:var(--ink-2);line-height:1.6" }, [
        el("p", { html: `Final objectives differ by <strong style="color:var(--ink)">${num(Math.abs(gap), 4)}</strong> in favour of ` +
          `${gap >= 0 ? "the hill climber" : "random search"}.` }),
        el("p", { style: "margin-top:10px", html: `The hill climber spent <strong style="color:var(--ink)">${num(speed, 1)}×</strong> less wall time for the ` +
          `same evaluation budget: it concentrates on regions it has already found cheap to fit, while uniform ` +
          `sampling keeps drawing spectral and iterative-imputer pipelines that cost seconds each. ` +
          `Equal-budget comparisons in evaluations are not equal-budget comparisons in time, and this is the direction that usually goes unreported.` }),
        el("p", { style: "margin-top:10px", html: `On a space this large — ${P4.space.total_configurations.toLocaleString()} configurations, of which ` +
          `${(ev.unique_evaluations + ev2.unique_evaluations).toLocaleString()} were seen — neither optimiser has meaningfully explored it. ` +
          `What the comparison establishes is that the climb is not <em>worse</em> than chance while being far cheaper.` }),
      ]);
    })(), "pad0 card"),
  ]));

  /* trial scatter */
  h.appendChild(grid("", [card("Every evaluation",
    "One mark per trial. Height is the objective; infeasible configurations sit below the rule, pushed there by the static-penalty constraint (Coello Coello, 2002) so that no infeasible solution can outrank a feasible one however good its indices look.",
    (() => {
      const w = 980, hh = 300, m = { t: 16, r: 14, b: 32, l: 48 };
      const { svg, g, iw, ih } = frame(w, hh, m);
      const ok = P4.trials.filter(t => t.error === null);
      const xs = scale(0, Math.max(...ok.map((_, i) => i), 1), 0, iw);
      const lo = Math.max(-1.6, Math.min(...ok.map(t => t.objective))), hi = Math.max(...ok.map(t => t.objective));
      const ys = scale(lo, hi + 0.05, ih, 0);
      ticks(lo, hi, 5).forEach(t => {
        g.appendChild(s_("line", { x1: 0, x2: iw, y1: ys(t), y2: ys(t), class: "gridline" }));
        g.appendChild(s_("text", { x: -8, y: ys(t) + 3.4, "text-anchor": "end" }, num(t, 2)));
      });
      g.appendChild(s_("line", { x1: 0, x2: iw, y1: ys(0), y2: ys(0), class: "axisline" }));
      const byOpt = { hill_climb: [], random_search: [] };
      let i = 0;
      P4.trials.forEach(t => { if (t.error === null) byOpt[t.optimiser].push([i++, t]); });
      Object.entries(byOpt).forEach(([k, arr], oi) => {
        arr.forEach(([ix, t]) => {
          const acc = t.accepted && t.optimiser === "hill_climb";
          const c = s_("circle", { cx: xs(ix), cy: ys(Math.max(t.objective, lo)), r: acc ? 3 : 1.9,
            fill: oi === 0 ? "var(--s1)" : "var(--s2)", opacity: acc ? .95 : .4,
            stroke: acc ? "var(--surface)" : "none", "stroke-width": acc ? 1.2 : 0 });
          bindTip(c, `<b>${num(t.objective, 4)}</b> · ${t.optimiser.replace("_", " ")}<br>` +
            `${t.step_kind}${t.move !== "sample" ? " · " + esc(t.move) : ""}<br>` +
            `k=${t.metrics.k ?? "—"} sil=${num(t.metrics.silhouette, 3)}<br>` +
            `<span style="color:var(--ink-3)">${esc((t.config.feature_view || "") + " | " + (t.config.transform || "") + " | " + (t.config.scaler || "") + " | " + (t.config.reducer || ""))}<br>${esc(t.config.algorithm)}</span>` +
            (t.metrics.feasible === false ? "<br><span style='color:var(--finding)'>infeasible</span>" : ""));
          g.appendChild(c);
        });
      });
      g.appendChild(s_("text", { x: iw, y: ih + 26, "text-anchor": "end", class: "axis-t" }, "trial order (hill climb, then random search)"));
      const box = el("div"); box.appendChild(svg);
      box.appendChild(el("div", { class: "legend" }, [
        el("span", {}, [Object.assign(el("span", { class: "swatch" }), { style: "background:var(--s1)" }), document.createTextNode("hill climb")]),
        el("span", {}, [Object.assign(el("span", { class: "swatch" }), { style: "background:var(--s2)" }), document.createTextNode("random search")]),
        el("span", { text: "large marks = accepted moves" }),
      ]));
      return box;
    })())]));

  h.appendChild(grid("g2", [
    card("Restart trajectories", "Each restart is an independent climb from a random configuration. Flat tails are local optima; the spread between them is why restarts exist.",
      lineChart({ w: 460, h: 230, xlab: "local steps", ylab: "incumbent objective",
        xfmt: v => String(Math.round(v)),
        series: hc.restarts.map((r, i) => ({ name: `restart ${r.restart}`, color: SERIES(i),
          opacity: .85, pts: r.trace.map((v, j) => [j, v]) })) })),
    card("Move economics", "Where the climb spent its budget and what it got back.",
      table([
        { label: "Restart", num: true, get: r => r.restart },
        { label: "Steps", num: true, get: r => r.steps },
        { label: "Improving", num: true, get: r => r.improving_steps },
        { label: "Sideways", num: true, get: r => r.sideways_moves },
        { label: "Start", num: true, get: r => num(r.start, 3) },
        { label: "End", num: true, get: r => num(r.end, 3) },
        { label: "Gain", num: true, get: r => `<span style="color:${r.gain > 0 ? "var(--good)" : "var(--ink-3)"}">${num(r.gain, 3)}</span>` },
        { label: "Ended", get: r => `<span class="pill neutral plain">${r.terminated.replace("_", " ")}</span>` },
      ], hc.restarts)),
  ]));

  /* optimism */
  if (P4.optimism_analysis && P4.optimism_analysis.n_trials) {
    const oa = P4.optimism_analysis;
    h.appendChild(grid("g21", [
      card("Optimism of self-scoring", "Silhouette in the candidate's own modelling space minus the same labels' silhouette in the neutral space, by the dimensionality the candidate clustered in.",
        barChart({ w: 700, h: 240, ylab: "mean optimism (silhouette points)", yfmt: v => num(v, 2),
          data: Object.entries(oa.by_model_space_dims).map(([d, o]) => ({ l: d + "D", v: o.mean_optimism,
            color: +d <= 4 ? "var(--finding)" : "var(--accent)",
            tip: `<b>${d} dimensions</b><br>mean optimism ${num(o.mean_optimism, 3)}<br>${o.n} trials` })) })),
      card("The prize", null, el("div", { style: "font-size:12.5px;color:var(--ink-2);line-height:1.6" }, [
        el("p", { html: `<strong style="color:var(--ink)">${pct(oa.pct_inflated / 100, 0)}</strong> of ${oa.n_trials} trials would have scored higher against themselves than against the neutral space; the mean inflation is <strong style="color:var(--ink)">${num(oa.mean_optimism, 3)}</strong> silhouette points.` }),
        el("p", { style: "margin-top:10px", html: `It decays monotonically with dimensionality — which is the mechanism, not a coincidence. Fewer retained components means less of the variance that would have put points on the wrong side of a boundary.` }),
        el("p", { style: "margin-top:10px", html: `Worst case in this run:` }),
        el("div", { class: "mono-block", style: "margin-top:6px;white-space:pre-wrap", text: oa.worst_case.pipeline }),
        el("p", { style: "margin-top:8px", html: `silhouette <strong style="color:var(--finding)">${num(oa.worst_case.self_silhouette, 3)}</strong> against itself, <strong style="color:var(--ink)">${num(oa.worst_case.neutral_silhouette, 3)}</strong> against the features. A perfect score, and worth nothing.` }),
      ])),
    ]));
  }

  /* dimension importance */
  if (P4.dimension_importance.length)
    h.appendChild(grid("g21", [
      card("Which decisions mattered", "Share of objective variance attributable to each search dimension — a one-way η², the model-free cousin of fANOVA (Hutter et al., 2014). Hill climbing samples non-uniformly, so these are observational effects over the trajectory; the random-search arm is pooled in to dilute that bias.",
        hbars(P4.dimension_importance.slice(0, 12).map(d => ({ l: d.dimension, v: d.eta_squared,
          tip: `<b>${esc(d.dimension)}</b><br>η² = ${num(d.eta_squared, 3)}<br>best: ${esc(d.best_value)} (${num(d.best_mean, 3)})<br>worst: ${esc(d.worst_value)} (${num(d.worst_mean, 3)})<br>${d.n_observed} trials over ${d.n_values} values` })),
          { fmt: v => num(v, 3) })),
      card("Best value per dimension", null,
        table([
          { label: "Dimension", get: r => `<span class="mono" style="font-size:11px">${esc(r.dimension)}</span>` },
          { label: "Best", get: r => `<span class="mono" style="font-size:11px;color:var(--accent)">${esc(r.best_value)}</span>` },
          { label: "Worst", get: r => `<span class="mono" style="font-size:11px;color:var(--ink-3)">${esc(r.worst_value)}</span>` },
          { label: "Δ", num: true, get: r => num(r.best_mean - r.worst_mean, 3) },
        ], P4.dimension_importance.slice(0, 12))),
    ]));

  /* leaderboard */
  h.appendChild(grid("", [card("Leaderboard", "Top configurations by search objective, de-duplicated on the canonical pipeline hash.",
    table([
      { label: "#", num: true, get: r => r.rank },
      { label: "Obj", num: true, get: r => `<strong>${num(r.objective, 4)}</strong>` },
      { label: "Src", get: r => `<span class="pill ${r.optimiser === "hill_climb" ? "accent" : "neutral"} plain">${r.optimiser === "hill_climb" ? "HC" : "RS"}</span>` },
      { label: "k", num: true, get: r => r.metrics.k ?? "—" },
      { label: "Sil", num: true, get: r => num(r.metrics.silhouette, 3) },
      { label: "Self-sil", num: true, get: r => `<span style="color:var(--ink-3)">${num(r.metrics.self_silhouette, 3)}</span>` },
      { label: "DB", num: true, get: r => num(r.metrics.davies_bouldin, 2) },
      { label: "Min seg", num: true, get: r => pct(r.metrics.min_cluster_frac, 1) },
      { label: "Pipeline", get: r => `<span class="mono" style="font-size:11px">${esc(r.pipeline)}</span>` },
      { label: "s", num: true, get: r => num(r.elapsed_s, 2) },
    ], P4.leaderboard, { scroll: true }))]));

  /* transfer + finalists */
  const ts = P4.transfer_study || {};
  h.appendChild(grid("g12", [
    card("Subsample → full book", "Does the ranking transfer?", el("div", { style: "font-size:12.5px;color:var(--ink-2);line-height:1.6" }, [
      ts.spearman_full_range !== undefined ? el("div", {}, [
        el("div", { class: "tile", style: "padding:0;border:0;background:none" }, [
          el("div", { class: "lab", text: "Spearman ρ, full range" }),
          el("div", { class: "val", style: "font-size:30px", text: num(ts.spearman_full_range, 3) }),
          el("div", { class: "sub", html: `${ts.n_probed} configurations refit on all ${P2.provenance.rows.toLocaleString()} records, stratified across the observed objective range` }),
        ]),
        el("p", { style: "margin-top:12px", html: `<strong style="color:var(--ink)">${esc(ts.verdict)}</strong>` }),
        el("p", { style: "margin-top:10px", html: `Top-band ρ is <span class="mono">${num(ts.spearman_top_band, 3)}</span>. ${esc(ts.caveat)}` }),
      ]) : el("p", { text: "Transfer study unavailable for this run." }),
      el("p", { style: "margin-top:10px", html: `${P4.finalist_refit.n_feasible_on_full}/${P4.finalist_refit.n_refit} finalists remain feasible at full scale; mean objective change on refit is <span class="mono">${num(P4.finalist_refit.mean_objective_drop, 3)}</span>. A configuration whose smallest segment holds 4% of a 4,000-row sample can hold 1% of the book, which is why the champion is chosen here rather than at the end of the search.` }),
    ])),
    card("Finalists refit on the full book", "Re-ranked where it counts. The champion is the best feasible row, not the search winner.",
      table([
        { label: "Search #", num: true, get: r => r.search_rank },
        { label: "Search obj", num: true, get: r => num(r.search_objective, 4) },
        { label: "Full obj", num: true, get: r => r.error ? "—" : `<strong>${num(r.full_objective, 4)}</strong>` },
        { label: "Δ", num: true, get: r => r.error ? "—" : `<span style="color:${r.delta >= 0 ? "var(--good)" : "var(--finding)"}">${num(r.delta, 3)}</span>` },
        { label: "k", num: true, get: r => r.k ?? "—" },
        { label: "Min seg", num: true, get: r => r.error ? "—" : pct(r.min_cluster_frac, 1) },
        { label: "State", get: r => r.error ? '<span class="pill critical">error</span>' : (r.feasible ? '<span class="pill good">feasible</span>' : '<span class="pill warn">infeasible</span>') },
        { label: "Pipeline", get: r => `<span class="mono" style="font-size:11px">${esc(r.pipeline)}</span>` },
      ], P4.finalist_refit.finalists, { scroll: true })),
  ]));

  /* objective definition */
  h.appendChild(grid("g2", [
    card("Objective", "Three indices on a common scale, then constraints.", (() => {
      const box = el("div");
      box.appendChild(el("div", { class: "mono-block", text:
`score = 0.50·(sil+1)/2  +  0.30·1/(1+DB)  +  0.20·CH/(CH+κ)
        − penalty(min segment size, dominance, balance, noise, k)
        − 1.0  if any business constraint is violated

κ = ${num(P4.objective.calibration.kappa_ch, 1)}   (frozen from a calibration draw, before the search)` }));
      box.appendChild(el("p", { style: "font-size:12.5px;color:var(--ink-2);margin-top:10px;line-height:1.6",
        html: `Index choice follows Arbelaitz et al. (2013), whose comparison of 30 validity indices over 740 datasets ` +
        `puts silhouette, Davies–Bouldin and Calinski–Harabasz among the consistently strongest. CH is unbounded, so it ` +
        `cannot be averaged with a bounded index directly; the saturating map with a κ frozen <em>before</em> the search ` +
        `keeps the objective stationary, which a hill climber requires — normalising against the running history would ` +
        `mean comparing scores computed on two different scales.` }));
      return box;
    })()),
    card("Why constrained at all", null, el("div", { style: "font-size:12.5px;color:var(--ink-2);line-height:1.6" }, [
      el("p", { html: `Internal indices are documented to favour small k and spherical, equal-sized clusters ` +
        `(Milligan & Cooper, 1985; Vendramin et al., 2010). Left unconstrained, the objective here is maximised by a ` +
        `partition holding most of the book in one blob plus a handful of outlier pockets — silhouette 1.0, business value nil.` }),
      el("p", { style: "margin-top:10px", html: `The constraints are the charter's, not the statistician's: no segment below ` +
        `${pct(RUN.meta.run_config.search.min_cluster_frac, 0)} of the book, no segment above 60%, at least ` +
        `${RUN.meta.run_config.search.min_k_business} treatments, no more than ${pct(RUN.meta.run_config.search.max_noise_frac, 0)} of accounts unassigned.` }),
      el("p", { style: "margin-top:10px", html: `Handling is the static-penalty method: feasible solutions strictly dominate ` +
        `infeasible ones, while a graded penalty inside the infeasible region still points the climber back toward feasibility.` }),
    ])),
  ]));
}
</script>
<script>
"use strict";
/* ============================================================== EVALUATE == */
{
  const st = P5.stability, gap = P5.gap_statistic, dep = P5.deployed || {};
  const h = section("evaluate", "Phase 5", "Evaluation", `${st.rounds_completed} resampling replicates`,
    `Internal indices answer “is this partition geometrically tidy?”. They do not answer the two questions that ` +
    `decide whether a segmentation ships: <em>is it real</em> — would a different sample of the same book give the ` +
    `same segments — and <em>is it self-flattering</em>. Both are tested here.`);

  /* the charter loop */
  if (P5.champion_snapshot && P5.champion_snapshot.failed.length) {
    const cs = P5.champion_snapshot, cc = P5.charter_compliance;
    h.appendChild(el("div", { style: "margin-top:14px" }, note("The objective-optimal model failed the brief",
      `The search champion — <span class="mono">${esc(cs.pipeline)}</span> — maximises the objective ` +
      `(${num(cs.metrics.objective, 4)}) and fails <strong>${cs.failed.join(", ")}</strong>. ` +
      (cs.failed.includes("SC-2")
        ? `Its weakest segment has a bootstrap Jaccard of <strong>${num(Math.min(...Object.values(cs.per_cluster_jaccard)), 3)}</strong>, ` +
          `inside Hennig's “dissolved” band: the segment does not survive being refit on a different sample of the book, ` +
          `so there is nothing there to budget a campaign against. `
        : "") +
      `CRISP-DM draws an arrow from Evaluation back to Business Understanding for exactly this case, and this run walks it: ` +
      `${cc.n_evaluated} shortlisted pipelines were graded against the whole charter and ` +
      `${cc.n_compliant} satisfy every criterion. ` +
      `<strong>${esc(cc.verdict)}</strong>`)));
  }

  if (dep.differs_from_champion)
    h.appendChild(grid("g2", [
      card("Objective-optimal champion", "Wins the search. Not deployed.", el("div", {}, [
        el("div", { class: "mono-block", style: "white-space:pre-wrap", text: P5.champion_snapshot.pipeline }),
        (() => { const dl = el("dl", { class: "kv", style: "margin-top:10px" });
          [["Objective", num(P5.champion_snapshot.metrics.objective, 4)],
           ["Silhouette", num(P5.champion_snapshot.reference_space.silhouette, 3)],
           ["Mean ARI", num(P5.champion_snapshot.ari_mean, 3)],
           ["Weakest Jaccard", num(Math.min(...Object.values(P5.champion_snapshot.per_cluster_jaccard)), 3)],
           ["Failed", P5.champion_snapshot.failed.join(", ")],
          ].forEach(([k, v]) => { dl.appendChild(el("dt", { text: k })); dl.appendChild(el("dd", { text: String(v) })); });
          return dl; })(),
      ])),
      card("Deployed model", `${esc(dep.role)} — satisfies the whole charter.`, el("div", {}, [
        el("div", { class: "mono-block", style: "white-space:pre-wrap", text: dep.pipeline }),
        (() => { const dl = el("dl", { class: "kv", style: "margin-top:10px" });
          [["Objective", num(dep.metrics.objective, 4)],
           ["Silhouette", num(P5.reference_space.silhouette, 3)],
           ["Mean ARI", num(st.ari_mean, 3)],
           ["Weakest Jaccard", num(Math.min(...Object.values(st.per_cluster_jaccard).map(v => v.mean)), 3)],
           ["Cost of compliance", num(dep.metrics.objective - P5.champion_snapshot.metrics.objective, 4) + " objective"],
          ].forEach(([k, v]) => { dl.appendChild(el("dt", { text: k })); dl.appendChild(el("dd", { text: String(v) })); });
          return dl; })(),
      ])),
    ]));

  /* success criteria */
  h.appendChild(grid("", [card("Charter results", "Graded on the reference-space silhouette, not the modelling-space one — grading a model in the space that was tuned to flatter it is how a project passes its own exam.",
    table([
      { label: "", get: r => pill(r.passed ? "PASS" : "FAIL", r.passed ? "good" : "critical") },
      { label: "ID", get: r => `<span class="mono">${r.id}</span>` },
      { label: "Criterion", get: r => esc(r.criterion) },
      { label: "Evidence", get: r => `<span class="mono" style="font-size:11px">${esc(r.evidence)}</span>` },
      { label: "Why this bar", get: r => `<span style="color:var(--ink-3);font-size:11.5px">${esc(r.rationale)}</span>` },
    ], P5.success_criteria))]));

  /* space comparison + silhouette */
  h.appendChild(grid("g2", [
    card("Modelling space vs reference space", "The same labels, scored twice. The gap is the price of dimensionality reduction, and it belongs in the report rather than in a footnote.",
      table([
        { label: "Index", get: r => r[0] },
        { label: `Modelling (${CM.model_space_dims}-D)`, num: true, get: r => r[1] },
        { label: "Reference (17-D)", num: true, get: r => `<strong>${r[2]}</strong>` },
      ], [
        ["Silhouette", num(CM.self_silhouette, 4), num(P5.reference_space.silhouette, 4)],
        ["Davies–Bouldin", "—", num(P5.reference_space.davies_bouldin, 3)],
        ["Calinski–Harabasz", "—", num(P5.reference_space.calinski_harabasz, 0)],
      ])),
    card("Per-segment silhouette", "Rousseeuw's original diagnostic. A healthy mean can hide a segment whose members mostly sit on the wrong side of a boundary.",
      (() => { const b = el("div"); b.appendChild(silhouettePlot(P5.silhouette_profile, NAMES, 460));
        b.appendChild(table([
          { label: "Segment", get: r => `<span style="color:${SERIES(r.cluster)}">${esc(NAMES[r.cluster] ?? r.cluster)}</span>` },
          { label: "n", num: true, get: r => r.n.toLocaleString() },
          { label: "mean s", num: true, get: r => num(r.mean, 3) },
          { label: "% negative", num: true, get: r => num(r.pct_negative, 1) + "%" },
        ], P5.silhouette_profile.per_cluster)); return b; })()),
  ]));

  /* stability */
  h.appendChild(grid("g21", [
    card("Cluster-wise stability", `Best Jaccard overlap of each segment against ${st.rounds_completed} independent refits. Hennig (2007): above 0.85 highly stable, 0.60–0.85 a real but fuzzy pattern, below 0.60 dissolved.`,
      (() => { const b = el("div");
        b.appendChild(hbars(Object.entries(st.per_cluster_jaccard).map(([k, v]) => ({
          l: NAMES[+k] ?? ("Segment " + k), v: v.mean,
          tip: `<b>${esc(NAMES[+k] ?? k)}</b><br>mean Jaccard ${num(v.mean, 3)} ± ${num(v.std, 3)}<br>min ${num(v.min, 3)}<br>${esc(v.verdict)}` })),
          { max: 1, color: r => r.v > 0.85 ? "var(--good)" : r.v > 0.6 ? "var(--warn)" : "var(--critical)" }));
        b.appendChild(el("div", { class: "legend" }, [
          el("span", {}, [Object.assign(el("span", { class: "swatch" }), { style: "background:var(--good)" }), document.createTextNode("highly stable")]),
          el("span", {}, [Object.assign(el("span", { class: "swatch" }), { style: "background:var(--warn)" }), document.createTextNode("stable pattern")]),
          el("span", {}, [Object.assign(el("span", { class: "swatch" }), { style: "background:var(--critical)" }), document.createTextNode("dissolved")]),
        ]));
        return b; })()),
    card("Partition stability", null, el("div", {}, [
      tile("Mean ARI", num(st.ari_mean, 3), `95% CI ${st.ari_ci95.map(v => num(v, 3)).join(" – ")}`),
      el("div", { style: "margin-top:10px" }, (() => { const dl = el("dl", { class: "kv" });
        [["NMI", num(st.nmi_mean, 3)], ["Refit size", `${st.subsample_size.toLocaleString()} (${pct(st.subsample_frac, 0)})`],
         ["Co-assignment", num(st.mean_within_cluster_coassignment, 3)],
         ["Point agreement", pct(st.point_agreement.mean, 1)],
         ["Unstable accounts", `${num(st.point_agreement.pct_below_0_8, 1)}% agree on <80% of refits`],
        ].forEach(([k, v]) => { dl.appendChild(el("dt", { text: k })); dl.appendChild(el("dd", { text: String(v) })); });
        return dl; })()),
      el("p", { style: "font-size:12px;color:var(--ink-3);margin-top:10px;line-height:1.55",
        html: "Every replicate refits the <em>whole</em> pipeline, preprocessing included. Refitting only the clusterer would leak the full-data scaling into each replicate and inflate stability." }),
    ])),
  ]));

  /* k-sweep small multiples + gap */
  const sw = P5.k_sweep.filter(r => !r.error);
  h.appendChild(grid("g21", [
    card("How many segments?", esc(P5.k_sweep_note || ""), (() => {
      const b = el("div");
      const specs = [
        { key: "silhouette", label: "silhouette (reference space)", color: "var(--s1)" },
        { key: "objective", label: "constrained objective", color: "var(--s3)" },
        { key: "ari_mean", label: "bootstrap ARI", color: "var(--s2)" },
      ];
      specs.forEach(sp => {
        b.appendChild(el("div", { style: "font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:10px 0 -4px", text: sp.label }));
        b.appendChild(lineChart({ w: 700, h: 132, xfmt: v => String(Math.round(v)), dots: true,
          series: [{ name: sp.label, color: sp.color, pts: sw.map(r => [r.k, r[sp.key]]), dots: true }] }));
      });
      b.appendChild(el("p", { style: "font-size:12px;color:var(--ink-3);margin-top:8px;line-height:1.55",
        html: `Three different answers. Silhouette declines monotonically past k=${sw[0].k} — the small-k bias that Milligan &amp; Cooper documented in 1985 — while stability stays high everywhere, which is precisely von Luxburg's (2010) warning that stability is not a monotone signal for k. The constrained objective breaks the tie by refusing partitions the business cannot operate.` }));
      return b;
    })()),
    card("Gap statistic", "An independent, null-referenced read on k (Tibshirani, Walther & Hastie, 2001).",
      (() => {
        const b = el("div");
        b.appendChild(lineChart({ w: 380, h: 210, xfmt: v => String(Math.round(v)), dots: true, ylab: "Gap(k)",
          band: gap.k.map((k, i) => [k, gap.gap[i] - gap.s_k[i], gap.gap[i] + gap.s_k[i]]),
          series: [{ name: "Gap", color: "var(--s7)", pts: gap.k.map((k, i) => [k, gap.gap[i]]), dots: true }] }));
        b.appendChild(el("p", { style: "font-size:12px;color:var(--ink-2);margin-top:8px;line-height:1.55",
          html: gap.chosen_k
            ? `Rule — ${esc(gap.rule)} — selects <strong>k = ${gap.chosen_k}</strong>.`
            : `The rule (${esc(gap.rule)}) never fires: the gap keeps rising to k=${gap.k[gap.k.length - 1]} without stabilising. ` +
              `That is a finding, not a missing number — on this book the structure is not a set of compact, well-separated blobs, ` +
              `so a criterion built to detect them declines to answer. Shaded band is ±s<sub>k</sub> over ${gap.b_refs} Monte-Carlo reference draws.` }));
        return b;
      })()),
  ]));

  /* baselines + shootout */
  h.appendChild(grid("g2", [
    card("Baselines", "What the search had to beat. All scored in the neutral space on the full book.",
      table([
        { label: "Pipeline", get: r => `<div style="font-weight:500">${esc(r.name)}</div><div style="color:var(--ink-3);font-size:11.5px;max-width:36ch">${esc(r.why)}</div>` },
        { label: "Obj", num: true, get: r => r.error ? "—" : num(r.objective, 4) },
        { label: "Sil", num: true, get: r => r.error ? "—" : num(r.silhouette, 3) },
        { label: "k", num: true, get: r => r.k ?? "—" },
        { label: "", get: r => r.error ? '<span class="pill critical">error</span>' : (r.feasible ? "" : '<span class="pill warn">infeasible</span>') },
      ], P5.baselines)),
    card("Algorithm shootout", "Champion preprocessing held fixed; only the clusterer swapped. Answers how much of the result is the preprocessing and how much is the algorithm.",
      table([
        { label: "Algorithm", get: r => `<span class="mono" style="font-size:11.5px">${esc(r.algorithm)}</span>` },
        { label: "Family", get: r => `<span class="pill neutral plain">${esc(r.family)}</span>` },
        { label: "Obj", num: true, get: r => r.error ? "—" : num(r.objective, 4) },
        { label: "Sil", num: true, get: r => r.error ? "—" : num(r.silhouette, 3) },
        { label: "k", num: true, get: r => r.k ?? "—" },
        { label: "Noise", num: true, get: r => r.error ? "—" : pct(r.noise_frac, 0) },
        { label: "Ind. fid.", num: true, get: r => r.error ? "—" : pct(r.inductive_fidelity, 1) },
        { label: "s", num: true, get: r => r.error ? "—" : num(r.fit_seconds, 2) },
      ], P5.algorithm_shootout)),
  ]));

  /* the separation/stability frontier */
  const CCX = P5.charter_compliance;
  if (CCX && CCX.frontier && CCX.frontier.length) {
    h.appendChild(grid("g21", [
      card("Separation against reproducibility", "Every shortlisted pipeline, refit on the full book. The dashed lines are the charter's two bars; the top-right quadrant is the only compliant region.",
        (() => {
          const w = 700, hh = 320, m = { t: 16, r: 16, b: 40, l: 52 };
          const { svg, g, iw, ih } = frame(w, hh, m);
          const fr = CCX.frontier;
          const x0 = Math.min(0.15, ...fr.map(f => f.silhouette)), x1 = Math.max(0.33, ...fr.map(f => f.silhouette));
          const y0 = 0, y1 = 1;
          const xs = scale(x0, x1, 0, iw), ys = scale(y0, y1, ih, 0);
          axes(g, iw, ih, xs, ys, ticks(x0, x1, 5).map(v => ({ v, l: num(v, 2) })), ticks(y0, y1, 5),
               { yfmt: v => num(v, 1), ylab: "weakest segment Jaccard (SC-2)" });
          g.appendChild(s_("rect", { x: xs(0.25), y: ys(1), width: iw - xs(0.25), height: ys(0.6) - ys(1),
            fill: "var(--good)", opacity: .07 }));
          [[0.25, "v", "SC-1 · 0.25"], [0.6, "h", "SC-2 · 0.60"]].forEach(([v, dir, lab]) => {
            g.appendChild(dir === "v"
              ? s_("line", { x1: xs(v), x2: xs(v), y1: 0, y2: ih, stroke: "var(--finding)", "stroke-width": 1.2, "stroke-dasharray": "4 3" })
              : s_("line", { x1: 0, x2: iw, y1: ys(v), y2: ys(v), stroke: "var(--finding)", "stroke-width": 1.2, "stroke-dasharray": "4 3" }));
            g.appendChild(dir === "v"
              ? s_("text", { x: xs(v) + 4, y: 10, fill: "var(--finding)" }, lab)
              : s_("text", { x: iw, y: ys(v) - 4, "text-anchor": "end", fill: "var(--finding)" }, lab));
          });
          const fam = [...new Set(fr.map(f => f.family))];
          fr.forEach(f => {
            const c = s_("circle", { cx: xs(f.silhouette), cy: ys(f.min_jaccard),
              r: 5 + 7 * f.noise_frac, fill: SERIES(fam.indexOf(f.family)), opacity: .78,
              stroke: "var(--surface)", "stroke-width": 1.5 });
            bindTip(c, `<b>${esc(f.algorithm)}</b> · k=${f.k}<br>silhouette ${num(f.silhouette, 3)}<br>weakest Jaccard ${num(f.min_jaccard, 3)}<br>unassigned ${pct(f.noise_frac, 1)}<br>objective ${num(f.objective, 4)}<br><span style="color:var(--ink-3)">${esc(f.pipeline)}</span>`);
            g.appendChild(c);
          });
          g.appendChild(s_("text", { x: iw, y: ih + 30, "text-anchor": "end", class: "axis-t" },
            "reference-space silhouette (SC-1) — mark size = share of book left unassigned"));
          const b = el("div"); b.appendChild(svg);
          b.appendChild(el("div", { class: "legend" }, fam.map((k, i) => {
            const sw = el("span", { class: "swatch" }); sw.style.background = SERIES(i);
            return el("span", {}, [sw, document.createTextNode(k)]);
          })));
          return b;
        })()),
      card("The trade-off", null, el("div", { style: "font-size:12.5px;color:var(--ink-2);line-height:1.6" }, (() => {
        const rev = CCX.charter_revision;
        if (!rev) return [el("p", { html: `<strong style="color:var(--ink)">${esc(CCX.verdict)}</strong>` })];
        return [
          el("p", { html: `<strong style="color:var(--ink)">${esc(CCX.verdict)}</strong>` }),
          el("p", { style: "margin-top:10px", text: rev.argument }),
          el("div", { class: "tile", style: "margin-top:12px;padding:12px 0 0;border:0;border-top:1px solid var(--rule);background:none" }, [
            el("div", { class: "lab", text: "Achievable ceiling, fully reproducible partitions" }),
            el("div", { class: "val", style: "font-size:28px", text: num(rev.observed_ceiling, 3) }),
            el("div", { class: "sub", html: `across ${rev.n_stable_candidates} candidates whose every segment survives resampling. ` +
              `The ${rev.n_separated_but_unstable} candidates that clear 0.25 leave ${pct(rev.mean_noise_of_unstable, 0)} of the book unassigned on average.` }),
          ]),
          el("p", { style: "margin-top:12px", html: `<strong style="color:var(--ink)">Recommendation.</strong> ${esc(rev.recommendation)}` }),
        ];
      })())),
    ]));
  }

  /* charter compliance table */
  if (P5.charter_compliance)
    h.appendChild(grid("", [card("Charter compliance shortlist",
      `Each candidate refit on the full book, then graded on all five computable criteria with ${P5.charter_compliance.rounds_per_candidate} stability replicates apiece. SC-6 (latency) is verified in Phase 6 on the shipped model.`,
      table([
        { label: "", get: r => r.error ? pill("ERR", "critical") : pill(r.compliant ? "PASS" : `${r.n_failed} FAIL`, r.compliant ? "good" : "warn") },
        { label: "Pipeline", get: r => `<span class="mono" style="font-size:11px">${esc(r.pipeline)}</span>` },
        { label: "Obj", num: true, get: r => r.error ? "—" : num(r.objective, 4) },
        { label: "Sil", num: true, get: r => r.error ? "—" : num(r.silhouette, 3) },
        { label: "k", num: true, get: r => r.k ?? "—" },
        { label: "ARI", num: true, get: r => r.error ? "—" : num(r.ari_mean, 3) },
        { label: "Min Jaccard", num: true, get: r => r.error ? "—" : `<span style="color:${r.min_jaccard >= 0.6 ? "var(--good)" : "var(--critical)"}">${num(r.min_jaccard, 3)}</span>` },
        { label: "Min seg", num: true, get: r => r.error ? "—" : pct(r.min_share, 1) },
        { label: "Fidelity", num: true, get: r => r.error ? "—" : pct(r.surrogate_fidelity, 1) },
        { label: "Failed", get: r => r.error ? esc(r.error) : (r.compliant ? "—" : `<span class="mono" style="font-size:11px;color:var(--finding)">${Object.entries(r.checks).filter(([, v]) => !v).map(([k]) => k).join(" ")}</span>`) },
      ], P5.charter_compliance.candidates, { scroll: true }))]));
}
</script>
<script>
"use strict";
/* ============================================================== SEGMENTS == */
{
  const profs = SEG.profiles, ec = SEG.economics, sur = SEG.surrogate;
  const covered = profs.reduce((a, p) => a + p.share, 0);
  const h = section("segments", "§", "The segments", `${profs.length} segments · ${SEG.surrogate.n_leaves}-leaf surrogate`,
    `A cluster id is not a deliverable. Each segment gets a quantitative profile, a rule set a human can apply ` +
    `without the model, a named persona with a recommended action, and an explicit unit-economics estimate — ` +
    `so segments can be ranked by <em>value</em> rather than by size.`);

  if (covered < 0.995)
    h.appendChild(el("div", { style: "margin-top:14px" }, note("Unassigned at fit time",
      `The segments above cover ${pct(covered, 1)} of the book. The remaining ${pct(1 - covered, 1)} were left ` +
      `unlabelled by the density model, which is allowed to abstain. At scoring time nothing is unlabelled — ` +
      `the induced nearest-centroid rule assigns every account — but those records sit furthest from any centroid ` +
      `and should be read as the low-confidence tail, not as a segment.`, true)));

  /* scatter with projection toggle */
  h.appendChild(grid("", [(() => {
    const c = el("div", { class: "card" });
    const head = el("div", { style: "display:flex;align-items:baseline;gap:12px;flex-wrap:wrap" });
    head.appendChild(el("div", { class: "card-t", text: "Segment geometry" }));
    const tg = el("div", { class: "toggle", style: "margin-left:auto" });
    const host = el("div", { style: "margin-top:12px" });
    const cap = el("div", { class: "card-s" });
    const draw = which => {
      host.innerHTML = "";
      if (which === "pca") {
        const p = SEG.projection.pca;
        host.appendChild(scatterPlot({ x: p.x, y: p.y, label: p.label, names: NAMES, w: 980, h: 420,
          xlab: `PC1 · ${pct(p.explained_variance[0], 1)} of variance`, ylab: "PC2" }));
        cap.innerHTML = `${p.n_plotted.toLocaleString()} accounts, first two principal components of the modelling space ` +
          `(${pct(p.explained_variance[0] + p.explained_variance[1], 1)} of its variance). PCA preserves global geometry, ` +
          `so distance between groups is meaningful — but separation living in higher components is invisible here.`;
      } else {
        const t = SEG.projection.tsne;
        if (t.error) { host.appendChild(el("p", { text: "t-SNE unavailable: " + t.error })); return; }
        host.appendChild(scatterPlot({ x: t.x, y: t.y, label: t.label, names: NAMES, w: 980, h: 420,
          xlab: "t-SNE 1", ylab: "t-SNE 2", r: 2.6 }));
        cap.innerHTML = `${t.x.length.toLocaleString()}-account sample, perplexity 30. t-SNE shows local neighbourhoods ` +
          `and makes <em>inter-cluster distance and cluster size meaningless</em>. It sits beside PCA rather than replacing it: ` +
          `reading it alone is how people talk themselves into clusters that are not there.`;
      }
    };
    ["pca", "tsne"].forEach((k, i) => {
      const b = el("button", { text: k === "pca" ? "PCA" : "t-SNE", class: i === 0 ? "on" : "" });
      b.onclick = () => { [...tg.children].forEach(x => x.classList.remove("on")); b.classList.add("on"); draw(k); };
      tg.appendChild(b);
    });
    head.appendChild(tg); c.appendChild(head); c.appendChild(cap); c.appendChild(host);
    c.appendChild(legendFor(NAMES, IDS));
    draw("pca");
    return c;
  })()]));

  /* segment cards */
  const ecBy = Object.fromEntries(ec.map(e => [e.cluster, e]));
  h.appendChild(grid(profs.length >= 4 ? "g2" : "g" + Math.min(profs.length, 3), profs.map(p => {
    const e = ecBy[p.cluster] || {};
    const c = el("div", { class: "card" });
    c.appendChild(el("div", { style: "display:flex;align-items:center;gap:8px;flex-wrap:wrap" }, [
      Object.assign(el("span", { class: "seg-dot" }), { style: `background:${SERIES(p.cluster)}` }),
      el("div", { class: "card-t", text: p.persona }),
      pill(`${p.risk_posture} risk`, p.risk_posture === "low" ? "good" : p.risk_posture === "high" ? "critical" : "warn"),
    ]));
    c.appendChild(el("div", { class: "card-s", style: "margin-top:8px", text: p.thesis }));
    const stats = el("div", { style: "display:flex;gap:18px;margin-top:12px;flex-wrap:wrap" });
    [["Accounts", p.n.toLocaleString()], ["Share", pct(p.share, 1)],
     ["Value index", e.value_index !== undefined ? e.value_index + "×" : "—"],
     ["Contribution", money(e.annual_contribution)]].forEach(([k, v]) =>
      stats.appendChild(el("div", {}, [
        el("div", { class: "lab", style: "font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)", text: k }),
        el("div", { style: "font-family:var(--mono);font-size:15px;margin-top:2px", text: v }),
      ])));
    c.appendChild(stats);
    c.appendChild(el("div", { style: "margin-top:12px" }, hbars(p.signature.map(s => ({
      l: s.feature, v: s.z, tip: `<b>${esc(s.feature)}</b><br>segment mean ${num(s.mean, 2)}<br>book mean ${num(s.book_mean, 2)}<br>z = ${num(s.z, 2)}` })),
      { fmt: v => (v > 0 ? "+" : "") + num(v, 2), color: r => r.v >= 0 ? "var(--dv-pos)" : "var(--dv-neg)" })));
    c.appendChild(el("div", { style: "margin-top:12px;padding-top:10px;border-top:1px solid var(--rule)" }, [
      el("div", { class: "note-t", style: "color:var(--accent)", text: "Recommended action" }),
      el("div", { style: "font-size:12.5px;color:var(--ink-2);line-height:1.55", text: p.action }),
    ]));
    return c;
  })));

  /* z heatmap + economics */
  const zFeat = [...new Set(profs.flatMap(p => p.signature.map(s => s.feature)))].slice(0, 16);
  h.appendChild(grid("g21", [
    card("Behavioural signature", "Standardised deviation from the book average. Comparable across features in a way that dollar means are not.",
      heatmap({ rows: profs.map(p => `${p.cluster} · ${p.persona}`), cols: zFeat,
        values: profs.map(p => zFeat.map(f => p.z[f] ?? 0)), cell: 26, rowLab: 210, w: 720,
        tipFor: (i, j, v) => `<b>${esc(profs[i].persona)}</b><br>${esc(zFeat[j])}<br>z = ${num(v, 2)}` })),
    card("Where the money is", esc(SEG.economics_assumptions.note),
      (() => { const b = el("div");
        b.appendChild(hbars(ec.map(e => ({ l: NAMES[e.cluster] ?? ("Segment " + e.cluster), v: e.contribution_per_account,
          tip: `<b>${esc(NAMES[e.cluster])}</b><br>${money(e.annual_contribution)} total (${pct(e.share_of_contribution, 1)})<br>${money(e.contribution_per_account)}/account<br>interchange ${money(e.interchange)} · fees ${money(e.cash_advance_fees)} · interest ${money(e.net_interest)}` })),
          { fmt: v => money(v), color: r => r.v >= 0 ? "var(--accent)" : "var(--critical)" }));
        const dl = el("dl", { class: "kv", style: "margin-top:12px" });
        [["Interchange", pct(SEG.economics_assumptions.interchange_rate, 1)],
         ["Cash-advance fee", pct(SEG.economics_assumptions.cash_advance_fee, 1)],
         ["Purchase APR", pct(SEG.economics_assumptions.purchase_apr, 1)],
         ["Servicing", "$" + SEG.economics_assumptions.annual_servicing_cost + "/yr"],
        ].forEach(([k, v]) => { dl.appendChild(el("dt", { text: k })); dl.appendChild(el("dd", { text: v })); });
        b.appendChild(dl); return b; })()),
  ]));

  /* surrogate + boundary */
  h.appendChild(grid("g21", [
    card(`Surrogate rules — ${pct(sur.fidelity, 1)} fidelity`,
      "A depth-4 tree fitted to the model's <em>own assignments</em>. Fidelity is agreement with the model, not accuracy against truth — a low-fidelity tree is a nice story about a model that is doing something else.",
      el("div", { class: "mono-block", style: "max-height:340px;overflow:auto;white-space:pre", text: sur.rules_text })),
    card("What drives assignment", null, (() => { const b = el("div");
      b.appendChild(hbars(sur.feature_importance.slice(0, 10).map(f => ({ l: f.feature, v: f.importance })),
        { fmt: v => num(v, 3) }));
      b.appendChild(el("div", { class: "note-t", style: "margin-top:16px;color:var(--accent)", text: "Boundary accounts" }));
      const ba = SEG.boundary_accounts;
      b.appendChild(el("p", { style: "font-size:12.5px;color:var(--ink-2);line-height:1.55",
        html: `<strong style="color:var(--ink)">${num(ba.pct_low_margin, 1)}%</strong> of accounts sit in the bottom decile of ` +
          `nearest/second-nearest centroid gap` + (ba.pct_low_margin_and_unstable !== undefined
            ? `, and <strong style="color:var(--ink)">${num(ba.pct_low_margin_and_unstable, 1)}%</strong> are both close to a boundary ` +
              `and unstable across refits (${ba.n_flagged.toLocaleString()} accounts).` : ".") +
          ` These flip between monthly refreshes; their measured “segment response” is noise. The scoring artifact exposes ` +
          `a confidence flag so campaigns can exclude them or hold them out.` }));
      return b; })()),
  ]));
}

/* ================================================================ DEPLOY == */
{
  const card_ = P6.model_card, lat = P6.latency, drifts = P6.drift;
  const h = section("deploy", "Phase 6", "Deployment & monitoring", "scoring artifact + drift controls",
    `A segmentation is deployed as a <em>function</em>, not as a column in a CSV. The artifact carries its own ` +
    `feature engineering, so a caller passes the raw source schema and cannot reimplement the ratios slightly wrong — ` +
    `training/serving skew is the most common way a segmentation quietly stops working.`);

  const last = lat.measurements[lat.measurements.length - 1];
  h.appendChild(grid("g4", [
    tile("p95 latency", num(last.per_record_ms_p95, 4) + " ms", `per record at batch ${last.batch_size} · SC-6 bar is 5 ms`, true),
    tile("Single-record", num(lat.measurements[0].total_ms_p50, 2) + " ms", "batch of one — almost entirely fixed overhead"),
    tile("Artifact", RUN.meta.artifacts.model, "joblib bundle: preprocessing + assigner + reference stats"),
    tile("Inductive fidelity", pct((P5.deployed || CH).inductive_fidelity, 2), "agreement of the deployable rule with the fitted labels"),
  ]));

  h.appendChild(grid("g2", [
    card("Scoring latency", "Batch size is reported because it dominates. Quoting only the batch-of-1000 number hides the latency of the real-time decisioning path.",
      table([
        { label: "Batch", num: true, get: r => r.batch_size },
        { label: "Total p50", num: true, get: r => num(r.total_ms_p50, 2) + " ms" },
        { label: "Total p95", num: true, get: r => num(r.total_ms_p95, 2) + " ms" },
        { label: "Per record p50", num: true, get: r => num(r.per_record_ms_p50, 4) },
        { label: "Per record p95", num: true, get: r => num(r.per_record_ms_p95, 4) },
      ], lat.measurements)),
    card("Monitoring design", "Unsupervised learning has no delayed ground truth — nothing ever arrives to tell you the model went stale. Everything must be inferred from the inputs and the geometry.",
      el("div", {}, [
        el("div", { class: "flow", style: "margin-bottom:10px" }, [
          el("div", { class: "step", text: "1 · input drift (PSI per feature)" }),
          el("div", { class: "arrow", text: "→" }),
          el("div", { class: "step", text: "2 · segment mix" }),
          el("div", { class: "arrow", text: "→" }),
          el("div", { class: "step", text: "3 · distance to centroid" }),
        ]),
        el("p", { style: "font-size:12.5px;color:var(--ink-2);line-height:1.6",
          html: `PSI bins on the <em>training</em> deciles — the point is movement relative to what the model was fitted on. ` +
            `The 0.10 / 0.25 bands are a credit-scoring convention, a trigger for investigation rather than a hypothesis test. ` +
            `Segment mix moves before any single feature does; mean distance to centroid rises when new records stop fitting ` +
            `the segments they are being forced into.` }),
      ])),
  ]));

  h.appendChild(grid("g2", drifts.map(d => card(
    d.label, null, el("div", {}, [
      el("div", { style: "display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap" }, [
        pill(d.alert ? "ALERT" : "HEALTHY", d.alert ? "critical" : "good"),
        el("span", { style: "font-size:12.5px;color:var(--ink-2)", text: d.verdict }),
      ]),
      barChart({ w: 460, h: 200, rotate: true, ylab: "PSI", yfmt: v => num(v, 2),
        thresholds: [{ v: 0.25, l: "significant", color: "var(--critical)" }, { v: 0.10, l: "moderate", color: "var(--warn)" }],
        data: d.feature_psi.slice(0, 12).map(f => ({ l: f.feature.length > 16 ? f.feature.slice(0, 15) + "…" : f.feature,
          v: f.psi ?? 0, color: f.verdict === "significant" ? "var(--critical)" : f.verdict === "moderate" ? "var(--warn)" : "var(--accent)",
          tip: `<b>${esc(f.feature)}</b><br>PSI ${num(f.psi, 3)} — ${esc(f.verdict)}` })) }),
      (() => { const dl = el("dl", { class: "kv", style: "margin-top:10px" });
        [["Records", d.n_records.toLocaleString()],
         ["Significant / moderate", `${d.n_significant} / ${d.n_moderate}`],
         ["Segment-mix PSI", num(d.segment_mix_psi, 3)],
         ["Distance ratio", d.distance_ratio + "× training mean"],
        ].forEach(([k, v]) => { dl.appendChild(el("dt", { text: k })); dl.appendChild(el("dd", { text: String(v) })); });
        return dl; })(),
    ])))));

  h.appendChild(el("div", { style: "margin-top:14px" }, note("Positive control",
    `The second panel is a deliberately shifted book — high-spend accounts over-sampled, cash advances and balances ` +
    `inflated. <strong>A monitor that has never been observed to alarm is an untested monitor</strong>, so the shift ships with ` +
    `the model as a regression test. Note also which feature it does <em>not</em> catch: CASH_ADVANCE is 52% exact zeros, ` +
    `so its training deciles collapse onto a point mass and PSI stays low even after a 75% inflation. That is a real ` +
    `limitation of PSI on zero-inflated features, and it is why the monitor reads three signals rather than one.`)));

  /* model card */
  h.appendChild(grid("", [card("Model card", "Structure follows Mitchell et al. (FAT* 2019).", (() => {
    const b = el("div");
    const sect = (t, node) => {
      b.appendChild(el("div", { class: "note-t", style: "margin-top:16px;color:var(--accent)", text: t }));
      b.appendChild(node);
    };
    const dlOf = obj => { const dl = el("dl", { class: "kv" });
      Object.entries(obj).forEach(([k, v]) => {
        dl.appendChild(el("dt", { text: k.replace(/_/g, " ") }));
        dl.appendChild(el("dd", { html: Array.isArray(v) ? "<ul style='margin:0;padding-left:16px'>" + v.map(x => `<li>${esc(typeof x === "object" ? JSON.stringify(x) : x)}</li>`).join("") + "</ul>"
          : (typeof v === "object" && v !== null) ? `<span class="mono" style="font-size:11px">${esc(JSON.stringify(v))}</span>` : esc(v) }));
      });
      return dl; };
    sect("Model details", dlOf(card_.model_details));
    sect("Intended use", dlOf(card_.intended_use));
    sect("Factors", dlOf(card_.factors));
    sect("Metrics", dlOf(card_.metrics));
    sect("Training data", dlOf(card_.training_data));
    sect("Ethical considerations", el("ul", { style: "margin:0;padding-left:18px;font-size:12.5px;color:var(--ink-2);line-height:1.6" },
      card_.ethical_considerations.map(x => el("li", { text: x }))));
    sect("Caveats & recommendations", el("ul", { style: "margin:0;padding-left:18px;font-size:12.5px;color:var(--ink-2);line-height:1.6" },
      card_.caveats_and_recommendations.map(x => el("li", { text: x }))));
    return b;
  })())]));
}

/* ============================================================== RESEARCH == */
{
  const cites = RUN.research.citations;
  const h = section("research", "¶", "Research provenance", `${cites.length} sources`,
    `Every method used, the paper it comes from, and the function that implements it — so a claim on a panel can be ` +
    `traced to the code that produced it. The <em>deviation</em> line is the one that matters most, and the one usually missing: ` +
    `where this project departs from the paper, and why.`);

  const labels = { process: "Process", automl: "AutoML & CASH", search: "Search heuristics",
    validity: "Validity indices", stability: "Stability & agreement", algorithms: "Clustering algorithms",
    interpretability: "Interpretability", operations: "Operations" };
  RUN.research.topics.forEach(topic => {
    const rows = cites.filter(c => c.topic === topic);
    if (!rows.length) return;
    h.appendChild(el("div", { style: "margin-top:20px" }, card(labels[topic] || topic, null, (() => {
      const box = el("div");
      rows.forEach(c => {
        const w = el("div", { class: "cite" });
        w.appendChild(el("div", { class: "cite-h", html: `${esc(c.authors)} <span class="yr">(${c.year})</span> — ${esc(c.title)}` }));
        w.appendChild(el("div", { class: "cite-v", text: c.venue }));
        const dl = el("dl", { class: "cite-row" });
        dl.appendChild(el("dt", { text: "Used for" })); dl.appendChild(el("dd", { text: c.used_for }));
        dl.appendChild(el("dt", { text: "Implemented" })); dl.appendChild(el("dd", { class: "impl", text: c.implemented_in }));
        dl.appendChild(el("dt", { text: "Deviation" })); dl.appendChild(el("dd", { class: "dev", text: c.deviation }));
        w.appendChild(dl);
        box.appendChild(w);
      });
      return box;
    })())));
  });

  h.appendChild(el("div", { style: "margin-top:22px" }, card("Reproducing this run", null, el("div", {}, [
    el("div", { class: "mono-block", text:
`pip install -r requirements.txt
PYTHONPATH=src python -m ccseg.cli run              # full study  ->  artifacts/run.json
PYTHONPATH=src python -m ccseg.cli run --quick      # smoke test, ~40s
python dashboard/build_dashboard.py                 # rebuild this page
pytest tests/ -q                                    # invariants` }),
    (() => { const dl = el("dl", { class: "kv", style: "margin-top:12px" });
      [["Seed", RUN.meta.seed], ["Wall time", RUN.meta.wall_seconds + "s"],
       ["Python", RUN.meta.versions.python], ["scikit-learn", RUN.meta.versions.sklearn],
       ["numpy / pandas", `${RUN.meta.versions.numpy} / ${RUN.meta.versions.pandas}`],
       ["Platform", RUN.meta.versions.platform],
       ["Source checksum", RUN.phase2_data.provenance.sha256],
      ].forEach(([k, v]) => { dl.appendChild(el("dt", { text: k })); dl.appendChild(el("dd", { text: String(v) })); });
      return dl; })(),
  ]))));
}

/* ================================================================== nav === */
{
  const links = [...document.querySelectorAll(".nav a")];
  const secs = links.map(a => document.querySelector(a.getAttribute("href")));
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => { if (!e.isIntersecting) return;
      const i = secs.indexOf(e.target);
      links.forEach((a, j) => a.classList.toggle("on", j === i)); });
  }, { rootMargin: "-15% 0px -70% 0px", threshold: 0 });
  secs.forEach(s => s && io.observe(s));
  links.forEach(a => a.addEventListener("click", ev => {
    ev.preventDefault();
    document.querySelector(a.getAttribute("href")).scrollIntoView({ behavior: "smooth", block: "start" });
  }));
}
