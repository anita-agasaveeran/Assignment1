<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRISP-LM — Training & Research Dashboard</title>
<link rel="stylesheet" href="/static/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>🧠</text></svg>">
</head>
<body data-palette="#2a78d6,#eb6834,#1baf7a">
<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">CL</div>
      <div>
        <div class="brand-name">CRISP-LM</div>
        <div class="brand-sub">small LM · end to end</div>
      </div>
    </div>
    <nav id="nav">
      <button class="nav-item active" data-view="overview"><span class="ph">1</span>Overview</button>
      <button class="nav-item" data-view="data"><span class="ph">2·3</span>Data</button>
      <button class="nav-item" data-view="training"><span class="ph">4</span>Training</button>
      <button class="nav-item" data-view="evaluation"><span class="ph">5</span>Evaluation</button>
      <button class="nav-item" data-view="autoresearch"><span class="ph">4·5</span>AutoResearch</button>
      <button class="nav-item" data-view="papers"><span class="ph">lit</span>Papers</button>
      <button class="nav-item" data-view="model"><span class="ph">6</span>Model card</button>
      <button class="nav-item" data-view="chat"><span class="ph">6</span>Chat</button>
    </nav>
    <div class="side-foot">
      <div class="crisp-legend">CRISP-DM phase</div>
      <button id="theme-toggle" class="ghost-btn" title="Toggle theme">◐ Theme</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="view-title">Overview</h1>
        <p id="view-sub" class="sub">Project status across the full CRISP-DM cycle.</p>
      </div>
      <div class="topbar-right">
        <span id="health" class="pill pill-muted">connecting…</span>
        <button id="refresh" class="ghost-btn">↻ Refresh</button>
      </div>
    </header>
    <div id="content" class="content"></div>
  </main>
</div>

<div id="tooltip" class="tooltip" hidden></div>
<script src="/static/charts.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
