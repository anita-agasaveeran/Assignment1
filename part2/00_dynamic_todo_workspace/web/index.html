<!doctype html>
<html lang="en" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="A fast, keyboard-first todo app.">
<title>Tasks</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%236d5efc'/><path d='M9 16.5l4.5 4.5L23 11' stroke='white' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to tasks</a>

<div class="app" id="app" hidden>
  <!-- ───────────────────────── sidebar ───────────────────────── -->
  <aside class="sidebar" id="sidebar" aria-label="Views and lists">
    <div class="sidebar-head">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.2 4.2L19 7" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span class="brand-name">Tasks</span>
      </div>
      <button class="icon-btn sidebar-close" id="sidebarClose" aria-label="Close menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>

    <button class="search-trigger" id="searchTrigger">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="2"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Search or jump to…</span>
      <kbd>⌘K</kbd>
    </button>

    <nav class="nav" id="viewNav" aria-label="Smart views"></nav>

    <div class="nav-section">
      <div class="nav-section-head">
        <h2>Lists</h2>
        <button class="icon-btn xs" id="addListBtn" aria-label="New list" title="New list">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <nav class="nav" id="projectNav" aria-label="Lists"></nav>
    </div>

    <div class="nav-section" id="tagSection">
      <div class="nav-section-head"><h2>Tags</h2></div>
      <div class="tag-cloud" id="tagCloud"></div>
    </div>

    <div class="sidebar-foot">
      <div class="conn" id="conn" title="Live connection status">
        <span class="dot" aria-hidden="true"></span><span id="connText">Connecting…</span>
      </div>
      <div class="foot-actions">
        <button class="icon-btn" id="themeBtn" aria-label="Change theme" title="Theme (T)"></button>
        <button class="icon-btn" id="exportBtn" aria-label="Export tasks as JSON" title="Export JSON">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v11m0 0l-4-4m4 4l4-4M5 17v2a2 2 0 002 2h10a2 2 0 002-2v-2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="icon-btn" id="helpBtn" aria-label="Keyboard shortcuts" title="Shortcuts (?)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M9.6 9.4a2.5 2.5 0 114 2.3c-.9.6-1.6 1-1.6 2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17.2" r="1.1" fill="currentColor"/></svg>
        </button>
      </div>
    </div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <!-- ───────────────────────── main ───────────────────────── -->
  <main class="main" id="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="title-block">
        <h1 id="viewTitle" tabindex="-1">Today</h1>
        <p class="subtitle" id="viewSubtitle"></p>
      </div>
      <div class="topbar-actions">
        <div class="progress" id="progress" role="img" aria-label="Progress">
          <svg viewBox="0 0 36 36" aria-hidden="true">
            <circle class="track" cx="18" cy="18" r="15.5"/>
            <circle class="bar" id="progressBar" cx="18" cy="18" r="15.5"/>
          </svg>
          <span id="progressText">0%</span>
        </div>
        <div class="menu-wrap">
          <button class="icon-btn" id="sortBtn" aria-haspopup="true" aria-expanded="false" aria-label="Sort and filter" title="Sort & filter">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
          <div class="popover" id="sortMenu" hidden role="menu"></div>
        </div>
      </div>
    </header>

    <div class="composer-wrap">
      <form class="composer" id="composer" autocomplete="off">
        <span class="composer-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        </span>
        <input id="composerInput" type="text" placeholder="Add a task —  try “report friday 2pm !p1 #work”"
               aria-label="New task" maxlength="500" spellcheck="false">
        <button type="submit" class="btn primary sm" id="composerSubmit" disabled>Add</button>
      </form>
      <div class="parse-chips" id="parseChips" aria-live="polite"></div>
      <div class="filter-chips" id="filterChips"></div>
    </div>

    <section class="list-area" id="listArea" aria-live="polite" aria-busy="true">
      <ol class="tasks" id="taskList"></ol>
      <div class="empty" id="empty" hidden></div>
    </section>
  </main>

  <!-- ───────────────────────── detail drawer ───────────────────────── -->
  <aside class="detail" id="detail" hidden aria-label="Task details"></aside>
</div>

<div class="boot" id="boot"><div class="spinner" aria-label="Loading"></div></div>

<!-- overlays -->
<div class="palette-backdrop" id="paletteBackdrop" hidden>
  <div class="palette" role="dialog" aria-modal="true" aria-label="Command palette">
    <div class="palette-input">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="2"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="paletteInput" type="text" placeholder="Search tasks, jump to a list, run a command…"
             aria-label="Search or run a command" autocomplete="off" spellcheck="false">
      <kbd>esc</kbd>
    </div>
    <div class="palette-results" id="paletteResults" role="listbox"></div>
  </div>
</div>

<div class="modal-backdrop" id="modalBackdrop" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<div class="sr-only" id="srStatus" role="status" aria-live="polite"></div>

<script type="module" src="/js/app.js"></script>
<noscript><p style="padding:2rem;font:16px system-ui">This app needs JavaScript enabled.</p></noscript>
</body>
</html>
